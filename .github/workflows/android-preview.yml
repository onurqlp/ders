name: Android preview APK
on:
  push:
    branches: [feature/ayda-ders-ui-webview-apk]
    paths:
      - "android-webview/**"
      - ".github/workflows/android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Run unit tests and build preview APK
        working-directory: android-webview
        run: ./gradlew --no-daemon :app:testPreviewDebugUnitTest :app:assemblePreviewDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ayda-ders-preview-debug
          path: android-webview/app/build/outputs/apk/preview/debug/app-preview-debug.apk
          if-no-files-found: error
          retention-days: 14
