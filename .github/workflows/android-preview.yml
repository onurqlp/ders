name: Android preview APK
on:
  push:
    branches: [feature/ayda-ders-ui-webview-apk]
    paths:
      - "android-webview/**"
      - ".github/workflows/android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Run unit tests and build preview APK
        working-directory: android-webview
        run: ./gradlew --no-daemon :app:testPreviewDebugUnitTest :app:assemblePreviewDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ayda-ders-preview-debug
          path: android-webview/app/build/outputs/apk/preview/debug/app-preview-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools emulator system-images;android-${{ matrix.api-level }};google_apis;x86_64"
      - uses: actions/download-artifact@v4
        with:
          name: ayda-ders-preview-debug
          path: /tmp/ayda-apk
      - name: Start Android emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/ayda-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n ayda-test -k "system-images;android-${{ matrix.api-level }};google_apis;x86_64" -d pixel_2 --path "$ANDROID_AVD_HOME/ayda-test.avd" --force
          test -f "$ANDROID_AVD_HOME/ayda-test.ini"
          "$ANDROID_HOME/emulator/emulator" -avd ayda-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -verbose > /tmp/ayda-emulator.log 2>&1 &
          emulator_pid=$!
          if ! timeout 180s adb wait-for-device; then
            cat /tmp/ayda-emulator.log
            adb devices -l
            kill "$emulator_pid" || true
            exit 1
          fi
          booted=false
          for attempt in {1..60}; do
            boot_status="$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot_status" = "1" ]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [ "$booted" != "true" ]; then
            cat /tmp/ayda-emulator.log
            adb devices -l
            exit 1
          fi
      - name: Install and launch preview APK
        run: |
          adb install -r /tmp/ayda-apk/app-preview-debug.apk
          adb shell am start -W -n com.aydadil.ders.preview/com.aydadil.ders.MainActivity
          sleep 8
          adb shell pidof com.aydadil.ders.preview
          if adb logcat -d -t 4000 | grep -q "FATAL EXCEPTION: main"; then
            adb logcat -d -t 4000
            exit 1
          fi
