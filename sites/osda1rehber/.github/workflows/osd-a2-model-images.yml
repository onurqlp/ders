name: Render official ÖSD A2 model pages (review only)
on:
  push:
    branches:
      - a2-onay-taslagi-20261019
    paths:
      - 'a2/tools/render_model_scans.py'
      - '.github/workflows/osd-a2-model-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install PDF rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check Pillow
      - name: Render screenshots from official 12-page ZA2 model
        run: python a2/tools/render_model_scans.py
      - name: Commit only generated scans to review branch
        run: |
          git config user.name "AYDA preview bot"
          git config user.email "127854929+onurqlp@users.noreply.github.com"
          git add a2/assets/model/
          if ! git diff --cached --quiet; then
            git commit -m "Add official ZA2 model task scans to A2 review only"
            git push origin HEAD:a2-onay-taslagi-20261019
          else
            echo "Images are already up to date"
          fi
