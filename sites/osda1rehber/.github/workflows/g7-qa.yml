name: G7 OSD Logo and Portal QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/g7-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python -m pip install selenium
      - name: Verify homepage and A1 A2 logos
        run: |
          python - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          o=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage']:o.add_argument(a)
          d=webdriver.Chrome(options=o)
          try:
            for path,selector in [('/','.sitehead .brand img'),('/a1/','header .brand img'),('/a2/','header .brand img')]:
              for name,w,h in [('desktop',1440,900),('mobile',390,844)]:
                d.set_window_size(w,h);d.get('https://osd.aydadil.com'+path+'?g7='+str(time.time()));time.sleep(5)
                z=d.execute_script("""const a=document.querySelector(arguments[0]);let r=a?.getBoundingClientRect();return{url:location.href,logo:!!a&&a.complete&&a.naturalWidth>40,width:r?.width,visible:!!r&&r.width>60&&r.height>18,headerBg:getComputedStyle(document.querySelector('header')).backgroundColor,overflow:document.documentElement.scrollWidth-innerWidth,title:document.title}""",selector)
                print(json.dumps({'page':path,'screen':name,'checks':z},ensure_ascii=False),flush=True)
                assert z['logo'] and z['visible'] and (path!='/' or z['headerBg']=='rgb(35, 64, 120)')
            print('G7_OSD_LOGO_VERIFIED')
          finally:d.quit()
          PY
