n Erhalt demonstrierten. Später ist das Gebäude in ein Kulturzentrum umgebaut worden. Das hätte ich gern erlebt, weil die ganze Stadt beteiligt war.`}},{id:23,title:`Fahrradfahren ist in.`,topicTr:`Çevre, ulaşım ve taviz`,vocabulary:[`çevre`,`iklim`,`hareketlilik`],grammar:[`(an)statt/ohne ... zu`,`(an)statt/ohne dass`],communication:`Katılma, karşı çıkma ve kayıtsızlığı ifade etme`,readingWriting:`Çevre röportajı ve forum görüşü`,speaking:`Ulaşım tercihini savunma`,logic:`Özneler aynıysa zu'lu kısa yapı; farklıysa dass cümlesi kullanılır. ohne beklenen eşlik eden eylemin olmadığını, statt alternatif eylemi gösterir.`,wordOrder:`zu'lu yapıda çekimli fiil yoktur; dass cümlesinde fiil sona gider.`,pitfall:`Özneler farklıyken ohne zu kullanmak anlamı yanlış özneye bağlar.`,tip:`Özne aynı mı? zu mümkün. Farklı mı? dass şart.`,examples:[[`Ich fahre Rad, statt im Stau zu stehen.`,`Trafikte beklemek yerine bisiklete binerim.`],[`Er ging, ohne sich zu verabschieden.`,`Vedalaşmadan gitti.`],[`Wir sparen Energie, ohne dass der Komfort sinkt.`,`Konfor düşmeden enerji tasarrufu yapıyoruz.`]],comparison:[[`ohne zu`,`aynı özne`],[`ohne dass`,`farklı özne mümkün`],[`statt zu`,`alternatif eylem`]],questions:[d(`u23q1`,`Sie fährt mit der Bahn, statt das Auto ___.`,[`zu nehmen`,`nimmt`,`genommen`],`zu nehmen`,`Aynı özneyle statt + zu kullanılır.`),d(`u23q2`,`Die Stadt baut Radwege, ohne dass Parkplätze ganz ___.`,[`verschwinden`,`zu verschwinden`,`verschwunden`],`verschwinden`,`Farklı özne ve dass yan cümlesi fiili sona gönderir.`),f(`u23q3`,`Birleştir: Ich gehe zu Fuß. Ich verbrauche keine Energie.`,`Ich gehe zu Fuß, ohne Energie zu verbrauchen.`,`Özne aynı olduğu için ohne zu kullanılabilir.`),p(`u23q4`,`Cümleyi kur.`,[`statt`,`auf Gesetze`,`zu warten`,`können`,`wir`,`heute`,`anfangen`],`Statt auf Gesetze zu warten, können wir heute anfangen.`,`zu'lu grup başta, modal fiil ana cümlede ikinci konumdadır.`)],reading:{type:`Röportaj`,title:`Mobil ohne eigenes Auto`,text:`Ich habe mein Auto verkauft, ohne dass mein Alltag komplizierter geworden ist. Zur Arbeit fahre ich mit dem Rad, statt morgens im Stau zu stehen. Für große Einkäufe nutze ich Carsharing. Natürlich muss ich genauer planen. Dafür spare ich Geld, ohne auf spontane Ausflüge ganz zu verzichten.`,questions:[d(`u23r1`,`Yazar büyük alışverişte ne kullanıyor?`,[`Taksi`,`Araç paylaşımı`,`Otobüs`],`Araç paylaşımı`,`Üçüncü cümlede Carsharing deniyor.`),d(`u23r2`,`Dezavantaj nedir?`,[`Daha çok planlamak`,`Daha pahalı olması`,`İşe geç kalmak`],`Daha çok planlamak`,`Dördüncü cümle genauer planen gereğini belirtir.`)]},writing:{prompt:`Şehir içi ulaşım hakkında forum görüşü yaz.`,points:[`Kendi tercihini belirt`,`statt/ohne ile iki örnek ver`,`Bir karşı görüşe cevap ver`],phrases:[`Ich bin der Meinung, dass ...`,`Statt ..., ...`,`Das ist möglich, ohne dass ...`],minWords:95,sample:`Ich bin der Meinung, dass man in vielen Städten seltener Auto fahren kann. Statt jeden kurzen Weg mit dem Auto zu machen, kann man Rad fahren oder zu Fuß gehen. Ein gutes Verkehrsnetz ermöglicht Mobilität, ohne dass jeder ein eigenes Auto besitzt. Natürlich brauchen Familien manchmal mehr Flexibilität. Dafür sind Carsharing und sichere Radwege wichtige Ergänzungen.`},speakingTask:{context:`Ulaşım tartışmasında fikrini savunuyorsun.`,phrases:[`Da stimme ich voll und ganz zu.`,`Davon halte ich nicht viel, weil ...`,`Mein Standpunkt ist ...`],prompt:`Şehir merkezinde otomobil kısıtlamasını tartış.`,sample:`Mein Standpunkt ist, dass weniger Autos das Zentrum angenehmer machen. Statt Parkplätze zu suchen, sollten Besucher gute Busverbindungen nutzen können. Ein komplettes Verbot halte ich aber nicht für sinnvoll, weil manche Menschen auf das Auto angewiesen sind.`}},{id:24,title:`Das löst mehrere Probleme auf einmal.`,topicTr:`Gelecek vizyonları ve amaç`,vocabulary:[`gelecek`,`topluluk`,`çözüm`],grammar:[`damit`,`um ... zu`,`als ob + Konjunktiv II`],communication:`İkna etme ve bir vizyonu savunma`,readingWriting:`Gelecek
