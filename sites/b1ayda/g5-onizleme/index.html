radaki yaratıcı kişiyi tanıyor musun?`]],comparison:[[`die Kluge`,`belirli, dişil, Nominativ`],[`eine Kluge`,`belirsiz, dişil, Nominativ`],[`den Kollegen`,`eril n-Deklination, Akkusativ`]],questions:[d(`u1q1`,`___ hilft allen, wenn es schwierig wird.`,[`Der Hilfsbereite`,`Der Hilfsbereit`,`Den Hilfsbereiten`],`Der Hilfsbereite`,`Özne Nominativ olduğu için belirli artikelden sonra -e gelir.`),d(`u1q2`,`Ich spreche heute mit einem neuen ___.`,[`Kollege`,`Kollegen`,`Kolleges`],`Kollegen`,`mit Dativ ister; Kollege n-Deklination olduğu için -n alır.`),f(`u1q3`,`Düzelt: Wir suchen einen Zuverlässige.`,`Wir suchen einen Zuverlässigen.`,`Akkusativ eril ve ein-grubundan sonra adlaşmış sıfat -en alır.`),p(`u1q4`,`Doğru cümleyi kur.`,[`ich`,`an`,`der`,`Ehrlichen`,`schätze`,`ihre Offenheit`],`Ich schätze an der Ehrlichen ihre Offenheit.`,`Çekimli fiil ikinci konumdadır; an + Dativ burada kişide değer verilen özelliği gösterir.`)],reading:{type:`Forum profili`,title:`Unser neues Teammitglied`,text:`Seit Montag arbeitet Neda in unserem Team. Die Neue wirkt zuerst ruhig, aber sie stellt sehr genaue Fragen. Besonders angenehm finde ich, dass sie Absprachen zuverlässig notiert. Gestern hat sie einem Praktikanten geholfen, obwohl sie selbst viel zu tun hatte. Für mich ist sie deshalb nicht nur eine Kluge, sondern auch eine Hilfsbereite.`,questions:[d(`u1r1`,`Metnin ana fikri nedir?`,[`Neda'nın dış görünüşü`,`Neda'nın çalışma özellikleri`,`Stajyerin hatası`],`Neda'nın çalışma özellikleri`,`Metin Neda'nın güvenilir, dikkatli ve yardımsever oluşunu örneklerle anlatıyor.`),d(`u1r2`,`Neda neden yardımsever olarak görülüyor?`,[`Not aldığı için`,`Stajyere yardım ettiği için`,`Sessiz olduğu için`],`Stajyere yardım ettiği için`,`Son iki cümle bu değerlendirmeyi doğrudan destekler.`)]},writing:{prompt:`Yeni bir kurs arkadaşını tanıtan kısa mesaj yaz.`,points:[`Kişiyi nereden tanıdığını söyle`,`İki karakter özelliğini örnekle`,`Birlikte ne yapmak istediğini ekle`],phrases:[`An ihr/ihm schätze ich, dass ...`,`Besonders sympathisch finde ich ...`,`Außerdem ...`],minWords:60,sample:`Seit zwei Wochen lerne ich mit Jonas im B1-Kurs. An ihm schätze ich, dass er sehr geduldig ist. Wenn ich ein Wort nicht verstehe, erklärt er es mit einem Beispiel. Außerdem ist er ein Humorvoller und bringt die ganze Gruppe zum Lachen. Am Samstag möchten wir zusammen für den Test lernen.`},speakingTask:{context:`Kurs grubuna önemli bulduğun bir karakter özelliğini açıklıyorsun.`,phrases:[`Für mich ist ... besonders wichtig.`,`Das merkt man daran, dass ...`,`Ein gutes Beispiel ist ...`],prompt:`İyi bir arkadaşta en önemli iki özellik nedir?`,sample:`Für mich sind Ehrlichkeit und Zuverlässigkeit am wichtigsten. Ein ehrlicher Mensch sagt respektvoll, was er denkt. Auf einen Zuverlässigen kann man sich auch in schwierigen Situationen verlassen.`}},{id:2,title:`Er erledigte seine Aufgaben zuverlässig.`,topicTr:`İş deneyimini geçmişte anlatma`,vocabulary:[`iş hayatı`,`staj`,`görevler`],grammar:[`Präteritum: düzenli, düzensiz ve karışık fiiller`],communication:`Geçmiş bir iş deneyimini değerlendirme`,readingWriting:`Staj raporu ve deneyim yazısı`,speaking:`İlk iş gününü anlatma`,logic:`Präteritum özellikle yazılı anlatıda ve sein, haben, modal fiillerde sık kullanılır. Düzenli fiiller -te alır; düzensizlerde kök değişebilir; karışık fiiller iki özelliği birleştirir.`,wordOrder:`Präteritum'daki çekimli fiil de ana cümlede ikinci sıradadır. Yan cümlede çekimli geçmiş fiili sona gider.`,pitfall:`bringen için bringte değil brachte; denken için denkte değil dachte denir.`,tip:`Metin türünü düşün: yazılı raporda Präteritum doğal, günlük konuşmada çoğu eylem için Perfekt daha yaygındır.`,examples:[[`Ich führte ein Kundengespräch.`,`Bir müşteri görüşmesi yürüttüm.`],[`Der erste Tag gefiel mir gut.`,`İlk gün hoşuma gitti.`],[`Weil ich müde war, machte ich früh Feierabend.`,`Yorgun olduğum için işi erken bıraktım.`]],comparison:[[`machte`,`düzenli: kök + te`],[`ging`,`düzensiz: kök değişimi`],[`brachte`,`karışık: değişim + te`]],questions:[d(`u2q1`,`Gestern ___ ich die neue Kollegin zum Kunden.`,[`begleitete`,`begleitete habe`,`begleitete bin`],`begleitete`,`Yazılı geçmiş anlatıda begleiten fiilinin Präteritum biçimi begleitete'dir.`),d(`u2q2`,`Der Chef ___ uns eine schwierige Aufgabe.`,[`gab`,`gebte`,`gegeben`],`gab`,`geben fiilinin Präteritum biçimi gab'dır.`),f(`u2q3`,`Präteritum yap: Wir bringen die Unterlagen.`,`Wir brachten die Unterlagen.`,`bringen karışık fiildir: brachte; çoğul özneyle brachten olur.`),p(`u2q4`,`Yan cümleyi kur.`,[`weil`,`das Praktikum`,`mir`,`gut`,`gefiel`],`weil das Praktikum mir gut gefiel`,`weil yan cümlesinde çekimli fiil sonda yer alır.`)],reading:{type:`Staj raporu`,title:`Mein erster Tag im Labor`,text:`Am ersten Tag zeigte mir Frau Kern das Labor. Danach erklärte sie die Sicherheitsregeln. Ich notierte jeden Schritt, denn später sollte ich eine Probe selbst prüfen. Zuerst machte ich einen kleinen Fehler, aber die Kollegin blieb ruhig. Am Ende gelang mir die Messung ohne Hilfe.`,questions:[d(`u2r1`,`Yazar ilk gün ne yaptı?`,[`Bir müşteriyi aradı`,`Güvenlik kurallarını öğrendi`,`Laboru temizledi`],`Güvenlik kurallarını öğrendi`,`İkinci cümlede kuralların açıklandığı belirtiliyor.`),d(`u2r2`,`Metinde gelişim nasıl gösteriliyor?`,[`Hata yapıp sonra işi tek başına başarmasıyla`,`İşten erken çıkmasıyla`,`Yeni bir cihaz almasıyla`],`Hata yapıp sonra işi tek başına başarmasıyla`,`Zuerst ... Fehler ve Am Ende ... ohne Hilfe karşıtlığı gelişimi gösterir.`)]},writing:{prompt:`Kısa bir iş veya staj deneyimi raporu yaz.`,points:[`Yer ve zamanı belirt`,`Üç görevi sırayla anlat`,`Deneyimini değerlendir`],phrases:[`Zuerst ...`,`Danach ...`,`Am Ende stellte ich fest, dass ...`],minWords:70,sample:`Letzten Sommer machte ich ein Praktikum in einer Apotheke. Am ersten Tag sortierte ich Waren und kontrollierte Lieferlisten. Danach zeigte mir eine Kollegin das Bestellsystem. Anfangs verstand ich nicht alles, aber sie erklärte es geduldig. Am Ende durfte ich eine Bestellung selbst vorbereiten. Das Praktikum gefiel mir, weil die Aufgaben abwechslungsreich waren.`},speakingTask:{context:`Bir iş görüşmesinde önceki deneyimini anlatıyorsun.`,phrases:[`Damals arbeitete ich ...`,`Zu meinen Aufgaben gehörte ...`,`Dabei lernte ich ...`],prompt:`Geçmişte yaptığın yararlı bir görevi anlat.`,sample:`Während meines Praktikums betreute ich die Besucher am Empfang. Ich beantwortete Fragen und leitete Anrufe weiter. Dabei lernte ich, auch in stressigen Situationen freundlich zu bleiben.`}},{id:3,title:`Mein Beruf ist meine Leidenschaft.`,topicTr:`Ev ve yaşam koşullarını ayrıntılı anlatma`,vocabulary:[`konut`,`mahalle`,`ev arama`],grammar:[`Relativsätze im Dativ`,`Relativsätze mit Präpositionen`],communication:`Bir istatistiği ve yaşam tercihini açıklama`,readingWriting:`Emlak ilanı ve mahalle tanıtımı`,speaking:`Bir konutu karşılaştırmalı tanıtma`,logic:`Relativsatz, daha önce söylenen isme ek bilgi verir. İlgi zamirinin cinsiyeti o isimden, hâli ise yan cümledeki görevinden gelir. Edat varsa zamirden önce gelir.`,wordOrder:`Relativsatz virgülle ayrılır ve çekimli fiil en sona gider: Das ist das Haus, in dem wir wohnen.`,pitfall:`Öncül isim der olsa bile fiil/edat Dativ istiyorsa dem kullanılır; yalnız artikeli kopyalamak yetmez.`,tip:`Önce cümlede boşluğun görevini sor: kime? nerede? hangi edatla? Sonra zamiri seç.`,examples:[[`Das ist die Nachbarin, der ich oft helfe.`,`Bu, sık sık yardım ettiğim komşu.`],[`Wir suchen ein Viertel, in dem Kinder sicher spielen.`,`Çocukların güvenle oynayabildiği bir semt arıyoruz.`],[`Die Wohnung, für die ich mich interessiere, ist hell.`,`İlgilendiğim ev aydınlık.`]],comparison:[[`der ich helfe`,`dişil öncül + Dativ`],[`in dem wir wohnen`,`nötr öncül + in/Dativ`],[`für die ich mich interessiere`,`dişil öncül + für/Akkusativ`]],questions:[d(`u3q1`,`Das ist der Makler, mit ___ ich gesprochen habe.`,[`der`,`dem`,`den`],`dem`,`mit her zaman Dativ ister; eril öncül için dem kullanılır.`),d(`u3q2`,`Wir mögen die Straße, in ___ viele Bäume stehen.`,[`der`,`die`,`denen`],`der`,`Straße dişildir ve in burada konum bildirerek Dativ ister.`),f(`u3q3`,`Birleştir: Das ist das Haus. Wir träumen von dem Haus.`,`Das ist das Haus, von dem wir träumen.`,`von Dativ ister; Haus nötr olduğu için dem seçilir.`),p(`u3q4`,`Relativsatz kur.`,[`die`,`Wohnung`,`hat`,`einen Balkon`,`für`,`wir uns interessieren`],`Die Wohnung, für die wir uns interessieren, hat einen Balkon.`,`für + Akkusativ ile dişil ilgi zamiri die olur; yan cümlenin fiili sonda kalır.`)],reading:{type:`Emlak ilanı`,title:`Ruhig und trotzdem zentral`,text:`Vermietet wird eine helle Zweizimmerwohnung in einem Viertel, in dem viele Familien leben. Zur Wohnung gehört ein Innenhof, in dem Fahrräder sicher stehen können. Die Haltestelle, von der man in zehn Minuten ins Zentrum fährt, liegt direkt um die Ecke. Gesucht werden ruhige Mieterinnen und Mieter, denen ein gutes Miteinander wichtig ist.`,questions:[d(`u3r1`,`İlanın ana avantajı nedir?`,[`Şehir dışında olması`,`Sakin ama ulaşımı kolay olması`,`Eşyalı olması`],`Sakin ama ulaşımı kolay olması`,`Başlık ve ulaşım bilgisi bu avantajı destekler.`),d(`u3r2`,`Ev sahipleri nasıl kiracılar arıyor?`,[`Bahçeyle ilgilenen`,`Komşuluğa önem veren`,`Evden çalışan`],`Komşuluğa önem veren`,`Son cümlede gutes Miteinander ifadesi geçiyor.`)]},writing:{prompt:`Bir arkadaşına yaşadığın semti tanıtan e-posta yaz.`,points:[`Konumu anlat`,`İki yeri Relativsatz ile tanıt`,`Bir avantaj ve dezavantaj yaz`],phrases:[`Ich wohne in einem Viertel, in dem ...`,`In der Nähe gibt es ..., das/die ...`,`Praktisch finde ich ...`],minWords:75,sample:`Ich wohne in einem Viertel, in dem es viele kleine Geschäfte gibt. Besonders mag ich den Park, in dem ich morgens jogge. Die Straßenbahn, mit der ich zur Arbeit fahre, kommt alle zehn Minuten. Leider ist die Hauptstraße abends laut. Trotzdem fühle ich mich hier wohl, weil die Nachbarn freundlich sind.`},speakingTask:{context:`İki konut seçeneğinden birini öneriyorsun.`,phrases:[`Ich würde die Wohnung wählen, die ...`,`Ein Vorteil ist ...`,`Dagegen spricht, dass ...`],prompt:`Senin için iyi bir evin üç özelliği nedir?`,sample:`Ich würde eine Wohnung wählen, die einen Balkon hat. Wichtig ist mir auch ein Viertel, in dem ich alles zu Fuß erreichen kann. Gegen eine Wohnung an einer Hauptstraße spricht der Lärm.`}},{id:4,title:`Obwohl ich Ihnen das erklärt habe, ...`,topicTr:`Müşteri hizmetlerinde sorun ve karşıtlık anlatma`,vocabulary:[`müşteri hizmetleri`,`şikâyet`,`telefon görüşmesi`],grammar:[`obwohl`,`trotzdem`],communication:`Telefonda şikâyet etme ve çözüm isteme`,readingWriting:`Resmî şikâyet e-postası`,speaking:`Sorunu kibar ama net açıklama`,logic:`obwohl beklenmeyen karşıtlığı yan cümleyle kurar; trotzdem ise ikinci bir ana cümlede sonucu öne çıkarır. Anlam yakın, cümle yapısı farklıdır.`,wordOrder:`obwohl yan cümlesinde fiil sonda; Trotzdem ile başlayan ana cümlede çekimli fiil hemen sonra gelir.`,pitfall:`Trotzdem ich bezahlt habe denmez. Yan cümle gerekiyorsa obwohl; trotzdem bağımsız ana cümlede kullanılır.`,tip:`Virgülden sonra fiil sonda mı? obwohl. Yeni cümlede fiil ikinci mi? trotzdem.`,examples:[[`Obwohl ich bezahlt habe, kam die Ware nicht.`,`Ödeme yaptığım hâlde ürün gelmedi.`],[`Ich habe bezahlt. Trotzdem kam die Ware nicht.`,`Ödedim. Buna rağmen ürün gelmedi.`],[`Warum ist der Anschluss gesperrt, obwohl die Rechnung bezahlt ist?`,`Fatura ödenmiş olmasına rağmen hat neden kapalı?`]],comparison:[[`obwohl + ... + fiil`,`yan cümle`],[`Trotzdem + fiil + özne`,`ana cümle`],[`aber`,`ana cümleler arasında sade karşıtlık`]],questions:[d(`u4q1`,`___ ich dreimal angerufen habe, bekam ich keine Antwort.`,[`Trotzdem`,`Obwohl`,`Denn`],`Obwohl`,`Çekimli fiil habe sonda olduğundan obwohl yan cümlesi gerekir.`),d(`u4q2`,`Die Lieferung war pünktlich. ___ war das Paket beschädigt.`,[`Obwohl`,`Trotzdem`,`Weil`],`Trotzdem`,`İkinci cümle bağımsızdır; trotzdem'den sonra fiil ikinci konumdadır.`),f(`u4q3`,`Düzelt: Trotzdem der Techniker gekommen ist, funktioniert das Gerät nicht.`,`Obwohl der Techniker gekommen ist, funktioniert das Gerät nicht.`,`Yan cümle yapısı için obwohl gerekir.`),p(`u4q4`,`Cümleyi kur.`,[`obwohl`,`die Rechnung`,`bezahlt`,`ist`,`wurde`,`der Anschluss`,`gesperrt`],`Obwohl die Rechnung bezahlt ist, wurde der Anschluss gesperrt.`,`obwohl yan cümlesinde ist sonda; ardından ana cümlede wurde ikinci konumdadır.`)],reading:{type:`Şikâyet e-postası`,title:`Bitte um schnelle Klärung`,text:`Sehr geehrte Damen und Herren, obwohl ich meinen Vertrag rechtzeitig verlängert habe, wurde mein Zugang gestern gesperrt. Im Kundenkonto steht trotzdem, dass alles aktiv ist. Ihre Hotline habe ich zweimal angerufen, aber nach zwanzig Minuten wurde die Verbindung jeweils beendet. Bitte prüfen Sie den Vorgang bis Freitag und bestätigen Sie mir die Freischaltung schriftlich.`,questions:[d(`u4r1`,`Müşterinin temel talebi nedir?`,[`Yeni sözleşme`,`Erişimin açılması ve yazılı onay`,`Ücret iadesi`],`Erişimin açılması ve yazılı onay`,`Son cümlede iki talep açıkça belirtiliyor.`),d(`u4r2`,`Hangi karşıtlık var?`,[`Sözleşme uzatıldığı hâlde erişim kapalı`,`Hat ücretsiz ama yavaş`,`Cuma günü açık`],`Sözleşme uzatıldığı hâlde erişim kapalı`,`İlk cümlede obwohl bu beklenmeyen durumu kuruyor.`)]},writing:{prompt:`Geç gelen bir sipariş için resmî şikâyet yaz.`,points:[`Sipariş tarihini belirt`,`Sorunu obwohl/trotzdem ile açıkla`,`Net bir çözüm ve süre iste`],phrases:[`Obwohl ich ..., ...`,`Trotzdem ...`,`Ich bitte Sie, ...`],minWords:80,sample:`Sehr geehrte Damen und Herren, am 3. Mai habe ich einen Schreibtisch bestellt. Obwohl ich die Rechnung sofort bezahlt habe, ist die Ware noch nicht angekommen. Laut Kundenkonto wurde das Paket versendet. Trotzdem gibt es seit einer Woche keine neue Information. Bitte liefern Sie den Tisch bis kommenden Mittwoch oder erstatten Sie mir den Kaufpreis. Mit freundlichen Grüßen`},speakingTask:{context:`Müşteri hattında sorunu anlatıyorsun.`,phrases:[`Es geht um ...`,`Obwohl ..., ...`,`Könnten Sie bitte prüfen, ob ...?`],prompt:`Yanlış fatura için kısa telefon konuşması yap.`,sample:`Guten Tag, es geht um meine letzte Rechnung. Obwohl ich den Tarif gewechselt habe, wurde noch der alte Preis berechnet. Könnten Sie bitte prüfen, wie die Differenz korrigiert wird?`}},{id:5,title:`Bald wird in fast jedem Haushalt ein PC stehen.`,topicTr:`Teknoloji ve geleceğe ilişkin tahminler`,vocabulary:[`medya`,`teknoloji`,`gelecek`],grammar:[`Futur I`,`Präsens + zaman ifadesi`],communication:`Tahmin, plan, uyarı ve söz verme`,readingWriting:`Gelecek anketi ve yorum`,speaking:`Bir tahmini gerekçelendirme`,logic:`Kesin planlarda Präsens + zaman ifadesi çoğu kez yeterlidir. Futur I ise özellikle tahmin, varsayım, söz veya güçlü uyarı tonunu taşır.`,wordOrder:`werden çekimli olarak ikinci konuma gelir; asıl fiilin mastarı cümle sonunda kalır: Wir werden morgen testen.`,pitfall:`Morgen werde ich gehe denmez; mastar gehen olmalı ve sona gitmelidir.`,tip:`Takvimde kesin mi? Präsens düşünebilirsin. Tahmin veya söz mü? werden + Infinitiv güçlü bir işarettir.`,examples:[[`Morgen testen wir die neue App.`,`Yarın yeni uygulamayı test ediyoruz.`],[`In zehn Jahren werden Geräte weniger Energie brauchen.`,`On yıl sonra cihazlar daha az enerjiye ihtiyaç duyacak.`],[`Ich werde deine Daten nicht weitergeben.`,`Verilerini paylaşmayacağım.`]],comparison:[[`Morgen kaufe ich ...`,`kesin plan`],[`Es wird wohl ... geben`,`tahmin`],[`Du wirst jetzt ...`,`güçlü uyarı`]],questions:[d(`u5q1`,`In Zukunft ___ viele Geräte automatisch Energie sparen.`,[`werden`,`wurden`,`würden`],`werden`,`Gelecek tahmini için werden + Infinitiv kullanılır.`),d(`u5q2`,`Wir ___ uns morgen um 10 Uhr online.`,[`treffen`,`werden getroffen`,`trafen`],`treffen`,`Kesin zamanlı plan Präsens ile doğal biçimde anlatılır.`),f(`u5q3`,`Tamamla: Ich verspreche, ich ___ dir heute Abend ___. (anrufen)`,`Ich verspreche, ich werde dir heute Abend anrufen.`,`Söz verme anlamında werden ikinci, anrufen mastarı sonda yer alır.`),p(`u5q4`,`Tahmini kur.`,[`wahrscheinlich`,`werden`,`Unterricht`,`digitale Tafeln`,`verändern`,`den`],`Wahrscheinlich werden digitale Tafeln den Unterricht verändern.`,`werden ikinci konumda, verändern cümle sonunda kalır.`)],reading:{type:`Anket özeti`,title:`Lernen im Jahr 2035`,text:`Bei einer Umfrage erwarten 62 Prozent der Befragten, dass digitale Assistenten den Lernplan individuell anpassen werden. Nur 18 Prozent glauben, dass Unterricht vollständig online stattfinden wird. Die Mehrheit wird also weiterhin gemeinsam lernen, aber digitale Werkzeuge werden Übungen schneller auswerten.`,questions:[d(`u5r1`,`Çoğunluğun beklentisi nedir?`,[`Okullar kapanacak`,`Dijital araçlar destek olacak`,`Sınavlar kalkacak`],`Dijital araçlar destek olacak`,`Metin tamamen çevrim içi eğitimi az kişinin beklediğini, araçların destek rolünü vurguluyor.`),d(`u5r2`,`Yüzde 18 ne düşünüyor?`,[`Eğitimin tamamen çevrim içi olacağını`,`Asistanların yasaklanacağını`,`Derslerin kısalacağını`],`Eğitimin tamamen çevrim içi olacağını`,`İkinci cümlede bu oran doğrudan veriliyor.`)]},writing:{prompt:`2035'te eğitim veya çalışma hakkında kısa görüş yazısı yaz.`,points:[`İki tahminde bulun`,`Bir tahmini gerekçelendir`,`Kendi planını belirt`],phrases:[`Ich vermute, dass ...`,`Wahrscheinlich wird ...`,`Für mich steht fest, dass ...`],minWords:75,sample:`Ich vermute, dass viele Teams 2035 an verschiedenen Orten arbeiten werden. Digitale Assistenten werden Routineaufgaben übernehmen, weil sie große Datenmengen schnell prüfen können. Persönliche Gespräche werden trotzdem wichtig bleiben. Ich selbst werde deshalb lernen, digitale Werkzeuge sinnvoll zu nutzen und Ergebnisse kritisch zu kontrollieren.`},speakingTask:{context:`Bir teknoloji tahmini tartışıyorsun.`,phrases:[`Ich halte es für wahrscheinlich, dass ...`,`Dafür spricht ...`,`Ich kann mir nicht vorstellen, dass ...`],prompt:`On yıl sonra akıllı telefonların rolü ne olacak?`,sample:`Ich halte es für wahrscheinlich, dass Smartphones kleiner oder teilweise unsichtbar werden. Dafür spricht, dass Sprachsteuerung immer besser wird. Ich kann mir aber nicht vorstellen, dass persönliche Geräte ganz verschwinden.`}},{id:6,title:`Fühlen Sie sich wie zu Hause.`,topicTr:`Davet ve sofra görgüsü`,vocabulary:[`davet`,`yemek`,`görgü kuralları`],grammar:[`falls`],communication:`Yarı resmî davet ve koşullu öneri`,readingWriting:`Davet yanıtı ve kısa görgü rehberi`,speaking:`Ev sahibine kibarca bilgi verme`,logic:`falls gerçek veya mümkün bir koşulu bildirir ve çoğu durumda wenn'e yakındır. Koşul gerçekleşirse ana cümledeki sonuç geçerli olur.`,wordOrder:`falls yan cümlesinde fiil sona gider. Yan cümle baştaysa ana cümle çekimli fiille başlar: Falls ..., rufen Sie ...`,pitfall:`falls'dan sonra ana cümle sırası kullanılmaz: falls Sie haben Zeit değil, falls Sie Zeit haben.`,tip:`Koşul biraz daha ihtimalli veya resmî tınlıyorsa falls iyi bir seçimdir.`,examples:[[`Falls Sie später kommen, geben Sie bitte Bescheid.`,`Geç gelecekseniz lütfen haber verin.`],[`Nehmen Sie noch Salat, falls Sie möchten.`,`İsterseniz biraz daha salata alın.`],[`Falls ich etwas mitbringen soll, ruf mich an.`,`Bir şey getirmem gerekiyorsa beni ara.`]],comparison:[[`falls`,`olası koşul; sıkça daha resmî`],[`wenn`,`genel/tekrarlanan veya gerçek koşul`],[`sofern`,`daha resmî: şartıyla`]],questions:[d(`u6q1`,`Falls Sie eine Allergie ___, informieren Sie uns bitte.`,[`haben`,`hatten`,`habt`],`haben`,`Sie öznesiyle haben kullanılır ve falls yan cümlesinde sona gider.`),d(`u6q2`,`___ du früher gehen musst, sag bitte kurz Bescheid.`,[`Trotzdem`,`Falls`,`Obwohl`],`Falls`,`İkinci bölüm, ilk bölümdeki koşul gerçekleşirse yapılacak eylemi anlatıyor.`),f(`u6q3`,`Düzelt: Falls es stört Sie nicht, öffne ich das Fenster.`,`Falls es Sie nicht stört, öffne ich das Fenster.`,`falls yan cümlesinde çekimli fiil sona gitmelidir.`),p(`u6q4`,`Kibar koşulu kur.`,[`falls`,`Sie`,`vegetarisch`,`essen`,`sagen`,`Sie`,`bitte`,`Bescheid`],`Falls Sie vegetarisch essen, sagen Sie bitte Bescheid.`,`Yan cümlede essen sonda; ana cümlede sagen hemen başta yer alır.`)],reading:{type:`Davet e-postası`,title:`Ein Abend im Garten`,text:`Liebe Kolleginnen und Kollegen, am Freitag feiern wir ab 18 Uhr im Garten. Falls das Wetter schlecht ist, treffen wir uns im Gemeinschaftsraum. Bitte gebt bis Mittwoch Bescheid, ob ihr kommt. Falls jemand vegetarisch isst oder eine Allergie hat, schreibt mir kurz. Getränke sind da; über einen kleinen Salat oder Nachtisch freuen wir uns.`,questions:[d(`u6r1`,`Yağmur yağarsa ne olacak?`,[`Kutlama iptal`,`Topluluk odasına geçilecek`,`Saat değişecek`],`Topluluk odasına geçilecek`,`İkinci cümle kötü hava koşulundaki alternatifi verir.`),d(`u6r2`,`Misafirlerden özellikle hangi bilgi isteniyor?`,[`Ulaşım biçimi`,`Beslenme ihtiyacı`,`Müzik tercihi`],`Beslenme ihtiyacı`,`Alerji ve vejetaryen beslenme için haber isteniyor.`)]},writing:{prompt:`Yarı resmî bir davete yanıt yaz.`,points:[`Teşekkür et ve gelip gelemeyeceğini söyle`,`Bir beslenme ihtiyacını belirt`,`Ne getirebileceğini sor`],phrases:[`Vielen Dank für die Einladung.`,`Falls es keine Umstände macht, ...`,`Soll ich etwas mitbringen?`],minWords:60,sample:`Liebe Frau Berger, vielen Dank für die Einladung. Ich komme am Freitag gern und bringe meinen Partner mit. Falls es keine Umstände macht, hätte ich gern etwas ohne Nüsse, weil ich allergisch bin. Soll ich einen Salat oder Getränke mitbringen? Herzliche Grüße`},speakingTask:{context:`Bir davette ev sahibine nazikçe ihtiyaç bildiriyorsun.`,phrases:[`Vielen Dank, das sieht lecker aus.`,`Es tut mir leid, aber ...`,`Falls es möglich ist, ...`],prompt:`Bir yiyeceği neden yiyemediğini ve alternatif isteğini söyle.`,sample:`Vielen Dank, das sieht sehr lecker aus. Es tut mir leid, aber ich vertrage keine Milchprodukte. Falls es möglich ist, nehme ich gern den Salat ohne Käse.`}}],h=[{id:7,title:`Kann ich Ihnen helfen?`,topicTr:`Ürün danışmanlığı ve karar verme`,vocabulary:[`hayvanlar`,`alışveriş`,`danışmanlık`],grammar:[`Infinitiv mit zu`],communication:`Tavsiye isteme, seçenek açıklama ve karar verme`,readingWriting:`Ürün tavsiyesi`,speaking:`Danışmanlık görüşmesi`,logic:`zu'lu mastar, ana cümledeki fiil, isim+haben veya es yapısına bağlı ikinci eylemi sıkıştırır. Ayrılabilen fiillerde zu iki parçanın arasına girer.`,wordOrder:`Mastar grubu çoğunlukla virgülden sonra gelir ve zu + mastar sonda kalır: Ich rate Ihnen, noch einmal nachzudenken.`,pitfall:`Modal fiillerden sonra zu kullanılmaz; anfangen gibi fiillerden sonra ise gerekir.`,tip:`İki eylemin öznesi aynıysa zu'lu mastar çoğu zaman kısa ve doğal bir çözümdür.`,examples:[[`Ich empfehle Ihnen, das Futter langsam zu wechseln.`,`Mamayı yavaşça değiştirmenizi öneririm.`],[`Es ist wichtig, genug Zeit einzuplanen.`,`Yeterli zaman planlamak önemlidir.`],[`Sie hört auf, spontan Tiere zu kaufen.`,`Düşünmeden hayvan almayı bırakıyor.`]],comparison:[[`Ich muss gehen.`,`modal fiil: zu yok`],[`Ich versuche zu gehen.`,`versuchen: zu var`],[`nachzudenken`,`ayrılabilen fiil`]],questions:[d(`u7q1`,`Ich rate dir, noch einmal ___.`,[`nachdenken`,`nachzudenken`,`zu nachdenken`],`nachzudenken`,`Ayrılabilen nachdenken fiilinde zu araya girer.`),d(`u7q2`,`Es macht Spaß, mit dem Hund ___.`,[`zu spielen`,`spielen zu`,`gespielt`],`zu spielen`,`es macht Spaß yapısından sonra zu'lu mastar kullanılır.`),f(`u7q3`,`Düzelt: Ich muss heute den Käfig zu reinigen.`,`Ich muss heute den Käfig reinigen.`,`Modal fiil müssen ile mastardan önce zu gelmez.`),p(`u7q4`,`Tavsiyeyi kur.`,[`ich`,`empfehle`,`Ihnen`,`die Kosten`,`vorher`,`zu prüfen`],`Ich empfehle Ihnen, die Kosten vorher zu prüfen.`,`Mastar grubu virgülle ayrılır ve zu prüfen sonda kalır.`)],reading:{type:`Danışmanlık notu`,title:`Passt ein Tier zu meinem Alltag?`,text:`Bevor Sie sich für ein Tier entscheiden, sollten Sie ehrlich prüfen, wie viel Zeit Sie täglich haben. Es reicht nicht, nur Futter zu kaufen. Ein Hund braucht Bewegung, ein Kaninchen ausreichend Platz und jedes Tier verlässliche Betreuung im Urlaub. Wir empfehlen deshalb, zuerst mit erfahrenen Haltern zu sprechen.`,questions:[d(`u7r1`,`Metnin amacı nedir?`,[`Bir hayvan satmak`,`Karardan önce sorumlulukları düşündürmek`,`Veteriner tanıtmak`],`Karardan önce sorumlulukları düşündürmek`,`Metin zaman, alan ve bakım sorumluluğunu öne çıkarıyor.`),d(`u7r2`,`Önerilen ilk adım nedir?`,[`Fiyat karşılaştırmak`,`Deneyimli sahiplerle konuşmak`,`Kafes almak`],`Deneyimli sahiplerle konuşmak`,`Son cümlede bu öneri açıkça verilir.`)]},writing:{prompt:`Bir ürünü veya hizmeti öneren kısa danışmanlık mesajı yaz.`,points:[`İhtiyacı belirt`,`İki seçenek karşılaştır`,`zu yapısıyla öneri ver`],phrases:[`Ich empfehle Ihnen, ...`,`Es ist sinnvoll, ...`,`Sie sollten bedenken, dass ...`],minWords:70,sample:`Für Ihren kleinen Balkon eignet sich ein kompakter Pflanzkasten. Das automatische System ist teurer, spart aber Zeit. Ich empfehle Ihnen, zuerst die verfügbare Breite zu messen. Es ist außerdem sinnvoll, ein Modell mit Wasseranzeige zu wählen. So vermeiden Sie, die Pflanzen zu oft zu gießen.`},speakingTask:{context:`Bir mağazada müşteriye seçenek anlatıyorsun.`,phrases:[`Wofür brauchen Sie ...?`,`Ich würde Ihnen ... empfehlen.`,`Sie sollten bedenken, dass ...`],prompt:`Yoğun çalışan birine uygun bir seçenek öner.`,sample:`Wenn Sie wenig Zeit haben, würde ich Ihnen dieses pflegeleichte Modell empfehlen. Sie brauchen es nur einmal pro Woche zu kontrollieren. Sie sollten aber bedenken, dass es etwas mehr kostet.`}},{id:8,title:`Während andere lange nachdenken, ...`,topicTr:`Güçlü yönler ve meslek seçimi`,vocabulary:[`güçlü yönler`,`yetenekler`,`meslekler`],grammar:[`da`,`bevor`,`während`],communication:`Görüş belirtme ve uygunluk gerekçelendirme`,readingWriting:`Meslek testi sonucu`,speaking:`Güçlü ve zayıf yönleri anlatma`,logic:`da neden bildirir ve weil'e benzer; bevor bir eylemin diğerinden önce olduğunu, während ise eşzamanlılık veya karşıtlık gösterir.`,wordOrder:`Üç bağlaç da yan cümle kurar; çekimli fiil sonda yer alır. Yan cümle baştaysa ana cümle fiille başlar.`,pitfall:`bevor ve während ile iki olayın zaman ilişkisini ters çevirmemek gerekir.`,tip:`Neden = da; önce = bevor; aynı anda veya karşılaştırma = während.`,examples:[[`Da ich gern organisiere, passt der Beruf zu mir.`,`Düzenlemeyi sevdiğim için meslek bana uygun.`],[`Bevor ich entscheide, sammle ich Informationen.`,`Karar vermeden önce bilgi toplarım.`],[`Während ich gern plane, arbeitet Leo lieber spontan.`,`Ben planlamayı severken Leo daha spontan çalışır.`]],comparison:[[`da`,`neden`],[`bevor`,`A, B'den önce`],[`während`,`eşzamanlılık/karşıtlık`]],questions:[d(`u8q1`,`___ ich mich bewerbe, lese ich die Stellenbeschreibung genau.`,[`Während`,`Bevor`,`Da`],`Bevor`,`Başvurmadan önce yapılan eylem anlatılıyor.`),d(`u8q2`,`___ Mira gern mit Menschen arbeitet, sucht sie einen sozialen Beruf.`,[`Da`,`Bevor`,`Trotzdem`],`Da`,`İlk bölüm sebebi açıklıyor.`),f(`u8q3`,`Birleştir: Ich arbeite konzentriert. Mein Bruder braucht Musik. (während)`,`Während ich konzentriert arbeite, braucht mein Bruder Musik.`,`während burada iki farklı çalışma tarzını karşılaştırır.`),p(`u8q4`,`Cümleyi kur.`,[`da`,`sie`,`technisch`,`begabt`,`ist`,`passt`,`der Beruf`,`zu ihr`],`Da sie technisch begabt ist, passt der Beruf zu ihr.`,`da yan cümlesinde ist sonda, ana cümlede passt baştadır.`)],reading:{type:`Meslek testi`,title:`Ihr Profil: analytisch und kontaktfreudig`,text:`Sie lösen Probleme gern systematisch, während Sie im Team offen kommunizieren. Bevor Sie eine Entscheidung treffen, vergleichen Sie mehrere Möglichkeiten. Da Sie auch unter Zeitdruck ruhig bleiben, passen Aufgaben in Beratung oder Projektkoordination gut zu Ihnen. Ein reiner Routinejob könnte Sie dagegen schnell langweilen.`,questions:[d(`u8r1`,`Hangi iş alanı öneriliyor?`,[`Proje koordinasyonu`,`Gece bekçiliği`,`Tekrarlı veri girişi`],`Proje koordinasyonu`,`Metin danışmanlık ve proje koordinasyonunu açıkça öneriyor.`),d(`u8r2`,`Neden rutin iş uygun olmayabilir?`,[`Ekip istemediği için`,`Çabuk sıkılabileceği için`,`Zaman baskısını sevmediği için`],`Çabuk sıkılabileceği için`,`Son cümlede langweilen ifadesi var.`)]},writing:{prompt:`Bir iş başvurusu için güçlü yönlerini anlat.`,points:[`İki güçlü yönünü örnekle`,`Bir gelişim alanı belirt`,`Neden uygun olduğunu açıkla`],phrases:[`Da ich ..., ...`,`Während andere ..., ...`,`Bevor ich ..., ...`],minWords:80,sample:`Da ich gern strukturiert arbeite, behalte ich auch bei mehreren Aufgaben den Überblick. Bevor ich etwas abgebe, kontrolliere ich die Details. Während manche unter Zeitdruck nervös werden, bleibe ich meistens ruhig. Ich möchte noch lernen, vor großen Gruppen sicherer zu sprechen. Für die Stelle bin ich geeignet, weil ich zuverlässig und lernbereit bin.`},speakingTask:{context:`Kariyer danışmanında kendini tanıtıyorsun.`,phrases:[`Eine meiner Stärken ist ...`,`Das zeigt sich daran, dass ...`,`Verbessern möchte ich ...`],prompt:`Hangi görevler sana uygun, hangileri zor?`,sample:`Eine meiner Stärken ist, komplexe Informationen zu ordnen. Deshalb passen Planungsaufgaben gut zu mir. Schwieriger finde ich spontane Präsentationen. Verbessern möchte ich, frei vor Gruppen zu sprechen.`}},{id:9,title:`Sport trägt zu einem größeren Wohlbefinden bei.`,topicTr:`Sağlık ve karşılaştırma`,vocabulary:[`sağlık`,`spor`,`beslenme`],grammar:[`Komparativ/Superlativ sıfat çekimi`],communication:`Sunum yapma ve deneyime dayalı öneri`,readingWriting:`Sağlık programı`,speaking:`Bir yöntemi karşılaştırma`,logic:`Komparativ ve Superlativ de isimden önce kullanıldığında normal sıfat gibi artikel ve hâle göre ek alır: ein gesünderer Alltag, mit der besten Methode.`,wordOrder:`Karşılaştırma ögesi isim grubunun içinde kalır; als eşitsizlik, wie eşitlik karşılaştırır.`,pitfall:`am besten yüklemle kullanılır; isimden önce der beste Kurs gerekir.`,tip:`Önce isimden önce mi sonra mı diye bak: isimden önceyse çekim eki şarttır.`,examples:[[`Wir suchen einen kürzeren Kurs.`,`Daha kısa bir kurs arıyoruz.`],[`Das ist die wirksamste Übung.`,`Bu en etkili egzersiz.`],[`Mit gesünderem Essen fühle ich mich besser.`,`Daha sağlıklı beslenmeyle kendimi daha iyi hissediyorum.`]],comparison:[[`besser`,`yüklemsel/zarf`],[`ein besserer Plan`,`isimden önce çekimli`],[`am besten`,`en üstün, isim yok`]],questions:[d(`u9q1`,`Ich brauche einen ___ Trainingsplan.`,[`flexibler`,`flexibleren`,`flexiblere`],`flexibleren`,`Akkusativ eril, ein-grubu: -en.`),d(`u9q2`,`Yoga ist für mich die ___ Methode gegen Stress.`,[`wirksamste`,`am wirksamsten`,`wirksamsten`],`wirksamste`,`Belirli artikel + dişil Nominativ önünde -e gelir.`),f(`u9q3`,`Düzelt: Dieser Kurs ist der anstrengender als der andere.`,`Dieser Kurs ist anstrengender als der andere.`,`Yüklemsel Komparativ artikel ve çekim eki almaz.`),p(`u9q4`,`Öneriyi kur.`,[`mit`,`einer`,`ausgewogeneren`,`Ernährung`,`fühlst`,`du dich`,`fitter`],`Mit einer ausgewogeneren Ernährung fühlst du dich fitter.`,`mit Dativ ister; dişil bir isimden önce Komparativ -en alır.`)],reading:{type:`Program tanıtımı`,title:`Aktiver durch kurze Pausen`,text:`Unser neues Programm setzt nicht auf längere Trainingseinheiten, sondern auf häufigere kurze Bewegungspausen. Teilnehmende berichten nach vier Wochen von besserem Schlaf und geringeren Rückenschmerzen. Die erfolgreichste Gruppe bewegte sich fünfmal täglich je acht Minuten. Entscheidend war nicht die höchste Leistung, sondern die regelmäßigste Teilnahme.`,questions:[d(`u9r1`,`Programın yaklaşımı nedir?`,[`Uzun ve yoğun spor`,`Sık, kısa hareket molaları`,`Sadece hafta sonu spor`],`Sık, kısa hareket molaları`,`İlk cümle bu karşılaştırmayı açıkça kuruyor.`),d(`u9r2`,`Başarıda en önemli olan neydi?`,[`En yüksek performans`,`Düzenli katılım`,`En pahalı ekipman`],`Düzenli katılım`,`Son cümle regelmäßigste Teilnahme der.`)]},writing:{prompt:`Sağlıklı bir alışkanlığı iki alternatifle karşılaştır.`,points:[`İki yöntemi tanıt`,`Avantajlarını karşılaştır`,`Kendi deneyimini veya önerini ekle`],phrases:[`... ist wirksamer als ...`,`Der größte Vorteil ist ...`,`Meiner Erfahrung nach ...`],minWords:80,sample:`Für meinen Alltag sind kurze Spaziergänge praktischer als lange Trainingseinheiten. Sie lassen sich leichter planen und ich brauche keine besondere Ausrüstung. Am wirksamsten ist für mich ein Spaziergang direkt nach der Arbeit. Danach kann ich mich besser konzentrieren. Wer wenig Zeit hat, sollte mit einer kürzeren Runde beginnen und sie regelmäßig wiederholen.`},speakingTask:{context:`Kısa bir sağlık sunumu yapıyorsun.`,phrases:[`Zuerst möchte ich erläutern ...`,`Meiner Erfahrung nach ...`,`Der wichtigste Punkt ist ...`],prompt:`Stresi azaltmak için en etkili yöntem nedir?`,sample:`Zuerst möchte ich kurze Bewegungspausen vorstellen. Meiner Erfahrung nach sind sie leichter einzuhalten als ein langer Sporttermin. Der wichtigste Punkt ist die Regelmäßigkeit. Schon zehn Minuten können den Kopf freier machen.`}},{id:10,title:`Hätte ich das bloß anders gemacht!`,topicTr:`Pişmanlık ve kaçırılmış fırsatlar`,vocabulary:[`günlük aksilikler`,`hata`,`hayal kırıklığı`],grammar:[`Konjunktiv II Vergangenheit`],communication:`Geçmiş pişmanlığı ifade etme ve teselli etme`,readingWriting:`Deneyim yorumu`,speaking:`Aksiliğe tepki verme`,logic:`Geçmişte gerçekleşmemiş bir dilek veya pişmanlık hätte/wäre + Partizip II ile kurulur. sein fiilleri genellikle wäre, diğerleri hätte alır.`,wordOrder:`Ana cümlede hätte/wäre ikinci konumda, Partizip II sonda. Ünlemde fiil başa gelebilir: Wäre ich doch ...!`,pitfall:`Geçmiş pişmanlığında würde + Infinitiv kullanılmaz.`,tip:`Perfekt yardımcı fiilini düşün, sonra onu Konjunktiv II yap: habe → hätte, bin → wäre.`,examples:[[`Hätte ich doch früher reserviert!`,`Keşke daha önce rezervasyon yapsaydım!`],[`Wären wir bloß pünktlich losgegangen!`,`Keşke zamanında yola çıksaydık!`],[`Ich hätte die Adresse prüfen sollen.`,`Adresi kontrol etmeliydim.`]],comparison:[[`Ich würde gehen.`,`şimdi/gelecek varsayımı`],[`Ich wäre gegangen.`,`geçmişte gerçekleşmedi`],[`Ich hätte gefragt.`,`geçmişte yapmadım`]],questions:[d(`u10q1`,`___ ich doch den Termin notiert!`,[`Wäre`,`Hätte`,`Würde`],`Hätte`,`notieren Perfekt'te haben alır; geçmiş dilekte hätte gerekir.`),d(`u10q2`,`Wir ___ früher losgefahren, wenn wir den Stau gekannt hätten.`,[`hätten`,`wären`,`würden`],`wären`,`losfahren hareket fiilidir ve Perfekt'te sein alır.`),f(`u10q3`,`Pişmanlık yap: Ich habe die Datei nicht gespeichert.`,`Hätte ich die Datei doch gespeichert!`,`Gerçekleşmeyen geçmiş dilek hätte + Partizip II ile kurulur.`),p(`u10q4`,`Cümleyi kur.`,[`wäre`,`sie`,`bloß`,`langsamer`,`gefahren`],`Wäre sie bloß langsamer gefahren!`,`Geçmiş dilek ünleminde wäre başta, Partizip sonda olabilir.`)],reading:{type:`Forum paylaşımı`,title:`Ein Klick zu früh`,text:`Gestern wollte ich meiner Kollegin einen Entwurf schicken. Leider wählte ich die gesamte Kundengruppe als Empfänger. Hätte ich die Liste doch vor dem Senden kontrolliert! Zum Glück enthielt die Datei keine vertraulichen Daten. Mein Chef blieb ruhig und half mir, die Nachricht sofort zu erklären. Seitdem prüfe ich Empfänger und Anhang zweimal.`,questions:[d(`u10r1`,`Hata neydi?`,[`Yanlış dosya silindi`,`E-posta çok kişiye gitti`,`Gizli veri paylaşıldı`],`E-posta çok kişiye gitti`,`İkinci cümlede tüm müşteri grubunun seçildiği söyleniyor.`),d(`u10r2`,`Yazar ne öğrendi?`,[`E-posta kullanmamak`,`Alıcı ve eki iki kez kontrol etmek`,`Şifre değiştirmek`],`Alıcı ve eki iki kez kontrol etmek`,`Son cümle yeni alışkanlığı açıklar.`)]},writing:{prompt:`Bir aksiliği ve sonradan ne öğrendiğini yaz.`,points:[`Olayı sırayla anlat`,`Pişmanlığı ifade et`,`Çözümü ve dersi belirt`],phrases:[`Hätte ich doch ...`,`Zum Glück ...`,`Seitdem ...`],minWords:80,sample:`Letzte Woche verpasste ich einen wichtigen Zug, weil ich zum falschen Bahnhof gefahren war. Hätte ich doch die Fahrkarte genauer gelesen! Zum Glück konnte ich die Besprechung online erreichen. Ich erklärte die Situation und entschuldigte mich. Seitdem kontrolliere ich nicht nur die Uhrzeit, sondern auch den Abfahrtsort am Vorabend.`},speakingTask:{context:`Bir arkadaşın başarısız bir denemeyi anlatıyor.`,phrases:[`Das ist wirklich ärgerlich.`,`So etwas kann passieren.`,`Vielleicht klappt es beim nächsten Mal, wenn ...`],prompt:`Arkadaşını teselli et ve bir öneri ver.`,sample:`Das ist wirklich ärgerlich, aber so etwas kann passieren. Du hast jetzt gesehen, welche Aufgabe schwierig war. Vielleicht klappt es beim nächsten Mal, wenn wir vorher zusammen üben.`}},{id:11,title:`Nachdem wir jahrelang Pech gehabt hatten, ...`,topicTr:`Geçmişte olayların sırası`,vocabulary:[`mutluluk anları`,`deneyimler`,`duygular`],grammar:[`Plusquamperfekt`,`nachdem`],communication:`Duygusal bir olayı anlatma ve tepki verme`,readingWriting:`Blog deneyimi`,speaking:`Hatırayı yapılandırma`,logic:`Plusquamperfekt, geçmişteki başka bir olaydan daha önce tamamlanan eylemi gösterir. nachdem bu önce-sonra ilişkisini görünür kılar.`,wordOrder:`hatte/war + Partizip II; nachdem yan cümlesinde yardımcı fiil sonda kalır. Ana olay çoğunlukla Präteritum veya Perfekt'tir.`,pitfall:`İki olayı da gelişigüzel Plusquamperfekt yapmak zaman ilişkisini bulanıklaştırır.`,tip:`Önce olanı Plusquamperfekt, sonra olanı normal geçmişle anlat.`,examples:[[`Nachdem ich bestanden hatte, rief ich meine Eltern an.`,`Sınavı geçtikten sonra ailemi aradım.`],[`Wir waren gegangen, bevor es regnete.`,`Yağmur yağmadan önce gitmiştik.`],[`Sie freute sich, weil sie lange darauf gewartet hatte.`,`Uzun süre beklediği için sevindi.`]],comparison:[[`hat gemacht`,`Perfekt`],[`hatte gemacht`,`Plusquamperfekt`],[`war gegangen`,`sein ile Plusquamperfekt`]],questions:[d(`u11q1`,`Nachdem er die Zusage ___, feierte er mit Freunden.`,[`bekommen hatte`,`bekam`,`bekommen hat`],`bekommen hatte`,`Önce gerçekleşen eylem Plusquamperfekt olur.`),d(`u11q2`,`Wir waren erleichtert, weil der Hund wieder nach Hause ___.`,[`kam`,`gekommen war`,`gekommen ist`],`gekommen war`,`Rahatlama anından önce eve dönüş tamamlanmıştır.`),f(`u11q3`,`Birleştir: Ich hatte die Prüfung bestanden. Danach lud ich alle ein.`,`Nachdem ich die Prüfung bestanden hatte, lud ich alle ein.`,`nachdem yan cümlesi önceki olayı Plusquamperfekt ile kurar.`),p(`u11q4`,`Cümleyi kur.`,[`nachdem`,`wir`,`lange`,`gesucht`,`hatten`,`fanden`,`wir`,`die Wohnung`],`Nachdem wir lange gesucht hatten, fanden wir die Wohnung.`,`Önce arama, sonra bulma gerçekleşir.`)],reading:{type:`Blog yazısı`,title:`Der Anruf am Freitag`,text:`Monatelang hatte ich Bewerbungen geschrieben und viele Absagen bekommen. Am Freitag klingelte plötzlich mein Telefon. Nachdem die Personalchefin meinen Namen genannt hatte, wusste ich sofort, worum es ging. Sie bot mir die Stelle an. Ich konnte zuerst kaum sprechen. Nachdem wir aufgelegt hatten, tanzte ich allein durch die Küche.`,questions:[d(`u11r1`,`Aramadan önce ne olmuştu?`,[`İş teklifi gelmişti`,`Birçok başvuru ve ret olmuştu`,`Taşınmıştı`],`Birçok başvuru ve ret olmuştu`,`İlk cümle bu geçmiş öncesini Plusquamperfekt ile verir.`),d(`u11r2`,`Yazarın duygusu nasıl gösteriliyor?`,[`Sessizce uyumasıyla`,`Mutfakta dans etmesiyle`,`Telefonu kapatmamasıyla`],`Mutfakta dans etmesiyle`,`Son cümledeki davranış güçlü sevinci gösterir.`)]},writing:{prompt:`Seni sevindiren bir anıyı olay sırasıyla yaz.`,points:[`Önceki durumu Plusquamperfekt ile ver`,`Ana olayı anlat`,`Duygunu ve tepkini ekle`],phrases:[`Nachdem ich ..., ...`,`Vorher hatte ich ...`,`In diesem Moment ...`],minWords:85,sample:`Vor zwei Jahren nahm ich an einem Fotowettbewerb teil. Vorher hatte ich monatelang jeden Morgen im Park fotografiert. Nachdem ich mein Bild abgeschickt hatte, dachte ich nicht mehr daran. Dann kam eine Nachricht: Ich hatte den zweiten Preis gewonnen. In diesem Moment war ich unglaublich stolz und rief sofort meine Schwester an.`},speakingTask:{context:`Bir mutluluk anını anlatıyorsun.`,phrases:[`Vorher hatte ich ...`,`Als dann ..., ...`,`Das hat mich besonders berührt, weil ...`],prompt:`Beklediğin güzel bir haber geldiğinde ne yaptın?`,sample:`Vorher hatte ich mehrere Wochen auf das Ergebnis gewartet. Als dann die Zusage kam, war ich zuerst sprachlos. Das hat mich besonders berührt, weil meine Familie mich die ganze Zeit unterstützt hatte.`}},{id:12,title:`Feiern im Büro?`,topicTr:`İş yerinde etkinlik ve resmî yazışma`,vocabulary:[`iş yeri etkinliği`,`çalışan temsilciliği`,`organizasyon`],grammar:[`Genitiv`,`Adjektivdeklination im Genitiv`,`trotz + Genitiv`],communication:`Davet, kabul ve ret yazma`,readingWriting:`Resmî davet ve yanıt`,speaking:`Organizasyon hakkında görüşme`,logic:`Genitiv aitlik ve ilişki gösterir. trotz çoğunlukla Genitiv alır. Eril/nötr isimler -s/-es, artikel ve sıfatlar uygun Genitiv eklerini alır.`,wordOrder:`Genitiv grubu cümlede tek bir isim grubu gibi yer değiştirir; fiil sırası değişmez.`,pitfall:`trotz dem schlechten Wetter günlük dilde duyulsa da standart yazı dilinde trotz des schlechten Wetters tercih edilir.`,tip:`Eril/nötrde des + sıfat -en + isim -(e)s kalıbını hatırla.`,examples:[[`Die Planung des jährlichen Festes beginnt.`,`Yıllık kutlamanın planlaması başlıyor.`],[`Trotz des starken Regens kamen viele Gäste.`,`Şiddetli yağmura rağmen çok kişi geldi.`],[`Wegen kurzfristiger Änderungen schreiben wir erneut.`,`Kısa vadeli değişiklikler nedeniyle yeniden yazıyoruz.`]],comparison:[[`des neuen Plans`,`eril Genitiv`],[`der guten Zusammenarbeit`,`dişil Genitiv`],[`trotz geplanter Arbeiten`,`artikelsiz çoğul`]],questions:[d(`u12q1`,`Trotz ___ Wetters fand das Fest draußen statt.`,[`des schlechten`,`dem schlechten`,`der schlechte`],`des schlechten`,`trotz standart dilde Genitiv; Wetter nötrdür.`),d(`u12q2`,`Die Einladung ___ Betriebsrats kam gestern.`,[`des`,`dem`,`den`],`des`,`Aitlik ilişkisi Genitiv ile kurulur.`),f(`u12q3`,`Tamamla: wegen / kurzfristig / Umbauarbeiten`,`wegen kurzfristiger Umbauarbeiten`,`Artikelsiz çoğul Genitiv'de sıfat -er alır.`),p(`u12q4`,`Cümleyi kur.`,[`trotz`,`der`,`guten`,`Vorbereitung`,`gab`,`es`,`ein Problem`],`Trotz der guten Vorbereitung gab es ein Problem.`,`Dişil Genitiv: der guten Vorbereitung.`)],reading:{type:`İş yeri duyurusu`,title:`Sommerfest wird verschoben`,text:`Liebe Kolleginnen und Kollegen, wegen notwendiger Umbauarbeiten kann unser Sommerfest nicht am 18. Juni stattfinden. Trotz der kurzfristigen Änderung bleibt das Programm gleich. Der neue Termin ist der 2. Juli. Die Anmeldung des Betriebsrats bleibt gültig. Falls Sie an diesem Tag verhindert sind, schreiben Sie bitte bis Montag an das Organisationsteam.`,questions:[d(`u12r1`,`Etkinlik neden ertelendi?`,[`Hava durumu`,`Tadilat çalışmaları`,`Az başvuru`],`Tadilat çalışmaları`,`İlk cümlede wegen notwendiger Umbauarbeiten deniyor.`),d(`u12r2`,`Ne değişmedi?`,[`Program ve mevcut kayıt`,`Yer`,`Katılımcı sayısı`],`Program ve mevcut kayıt`,`İkinci ve dördüncü cümle bunu belirtir.`)]},writing:{prompt:`Bir iş yeri davetine resmî yanıt yaz.`,points:[`Davet için teşekkür et`,`Kabul veya reddini gerekçelendir`,`Gerekirse alternatif öner`],phrases:[`Vielen Dank für Ihre Einladung.`,`Wegen ... kann ich leider ...`,`Trotzdem würde ich gern ...`],minWords:70,sample:`Sehr geehrte Frau Neumann, vielen Dank für Ihre Einladung zum Sommerfest. Wegen einer bereits geplanten Dienstreise kann ich am 2. Juli leider nicht teilnehmen. Trotzdem würde ich gern bei der Vorbereitung helfen. Falls Sie noch Unterstützung für die Einladungen brauchen, geben Sie mir bitte Bescheid. Mit freundlichen Grüßen`},speakingTask:{context:`İş yeri etkinliğini planlıyorsun.`,phrases:[`Trotz des knappen Budgets ...`,`Ein Vorteil des Vorschlags ist ...`,`Ich schlage vor, dass ...`],prompt:`Kısıtlı bütçeyle etkinlik için öneri yap.`,sample:`Trotz des knappen Budgets können wir ein schönes Fest organisieren. Ein Vorteil eines Picknicks ist der geringe Aufwand. Ich schlage vor, dass jede Abteilung etwas zu essen mitbringt.`}}],g=[{id:13,title:`Aus diesem Grund gab es ein Missverständnis.`,topicTr:`Yanlış anlaşılmalar ve neden-sonuç`,vocabulary:[`çok anlamlı kelimeler`,`dil`,`yanlış anlaşılma`],grammar:[`darum/deswegen/daher`,`nämlich`,`wegen + Genitiv`],communication:`Anlam sorma ve anlayışı güvenceye alma`,readingWriting:`Yanlış anlaşılma hikâyesi`,speaking:`Açıklama isteme`,logic:`Nedeni wegen veya nämlich ile; sonucu darum/deswegen/daher ile kurarız. nämlich nedeni sonradan açıklar ve ana cümle sırasını bozmaz.`,wordOrder:`Darum/deswegen/daher ilk konumdaysa fiil ikinci gelir. nämlich genelde cümle ortasındadır. wegen bir isim grubuyla kullanılır.`,pitfall:`nämlich cümle başında doğal değildir; weil gibi fiili sona göndermez.`,tip:`Grund mü Folge mi? Nedeni veriyorsan wegen/nämlich; sonucu veriyorsan darum/deswegen/daher.`,examples:[[`Wegen eines Dialekts verstand ich ihn nicht.`,`Bir lehçe nedeniyle onu anlamadım.`],[`Ich fragte nach. Die Betonung war nämlich ungewohnt.`,`Tekrar sordum; çünkü vurgu alışılmadıktı.`],[`Das Wort hatte zwei Bedeutungen. Daher entstand ein Missverständnis.`,`Kelimenin iki anlamı vardı. Bu yüzden yanlış anlaşılma oldu.`]],comparison:[[`wegen + isim`,`neden`],[`nämlich + ana cümle`,`sonradan açıklanan neden`],[`daher + fiil`,`sonuç`]],questions:[d(`u13q1`,`Der Zug fiel aus. ___ kamen wir zu spät.`,[`Nämlich`,`Deswegen`,`Wegen`],`Deswegen`,`İkinci cümle sonucu bildirir.`),d(`u13q2`,`Ich verstand das Wort nicht. Es hatte ___ zwei Bedeutungen.`,[`darum`,`nämlich`,`wegen`],`nämlich`,`nämlich önceki durumu gerekçelendirir.`),f(`u13q3`,`İsim grubu yap: wegen / ein kleines Missverständnis`,`wegen eines kleinen Missverständnisses`,`Eril/nötr Genitiv: eines + sıfat -en + isim -(e)s.`),p(`u13q4`,`Sonuç cümlesini kur.`,[`daher`,`konnte`,`ich`,`dem Gespräch`,`nicht folgen`],`Daher konnte ich dem Gespräch nicht folgen.`,`daher ilk konumda, konnte ikinci konumdadır.`)],reading:{type:`Deneyim yazısı`,title:`Das falsche Gericht`,text:`In einem Restaurant bestellte ich eine Speise, deren Name in meiner Sprache etwas anderes bedeutet. Aus diesem Grund erwartete ich ein süßes Gericht. Der Kellner brachte aber eine scharfe Suppe. Ich fragte noch einmal nach. Die Aussprache war nämlich fast gleich. Am Ende lachten wir beide über das Missverständnis.`,questions:[d(`u13r1`,`Yanlış beklentinin nedeni nedir?`,[`Menü yanlıştı`,`Kelime ana dilinde başka anlama geliyordu`,`Garson hızlı konuştu`],`Kelime ana dilinde başka anlama geliyordu`,`İlk iki cümle bu nedeni açıklar.`),d(`u13r2`,`Sorun nasıl çözüldü?`,[`Yazar tekrar sordu`,`Yemek geri gönderildi`,`Tercüman geldi`],`Yazar tekrar sordu`,`Ich fragte noch einmal nach cümlesi çözümü gösterir.`)]},writing:{prompt:`Yaşadığın veya hayal ettiğin bir yanlış anlaşılmayı anlat.`,points:[`Durumu açıkla`,`Neden ve sonucu iki farklı yapıyla bağla`,`Nasıl çözüldüğünü yaz`],phrases:[`Wegen ...`,`Aus diesem Grund ...`,`Ich fragte nach, denn/nämlich ...`],minWords:85,sample:`Bei einer Anmeldung sagte ich, dass ich einen Kurs am Abend suche. Die Mitarbeiterin verstand aber 'am achten'. Daher reservierte sie einen Kurs für den achten Mai. Ich bemerkte das Missverständnis wegen der Bestätigungsmail. Ich rief sofort an und erklärte es noch einmal. Die Aussprache war nämlich ähnlich. Zum Glück änderte sie die Buchung.`},speakingTask:{context:`Bir konuşmada anlamadığın noktayı netleştiriyorsun.`,phrases:[`Was bedeutet ... in diesem Zusammenhang?`,`Könnten Sie das bitte anders formulieren?`,`Habe ich Sie richtig verstanden, dass ...?`],prompt:`Bir kelimenin anlamını sor ve anladığını kontrol et.`,sample:`Entschuldigung, was bedeutet 'verbindlich' in diesem Zusammenhang? Könnten Sie das bitte mit einem Beispiel erklären? Habe ich Sie richtig verstanden, dass ich mich nach der Anmeldung nicht mehr kostenlos abmelden kann?`}},{id:14,title:`Die Teilnahme ist auf eigene Gefahr.`,topicTr:`Kurslar, eğitim ve risk`,vocabulary:[`eğitim`,`kurslar`,`hareket`],grammar:[`Partizip Präsens/Perfekt als Adjektiv`],communication:`Kurs önerme ve bilgi verme`,readingWriting:`Kurs programı ve teklif`,speaking:`Bir kursu gerekçeli önerme`,logic:`Partizip Präsens aktif/devam eden özelliği, Partizip Perfekt çoğu kez tamamlanmış veya edilgen sonucu sıfatlaştırır. İsimden önce normal sıfat eki alırlar.`,wordOrder:`Partizip sıfat isim grubunun içinde yer alır: die wartenden Teilnehmenden; der abgeschlossene Kurs.`,pitfall:`Partizip biçimini seçerken yapan mı etkilenmiş mi diye bak: faszinierende Einblicke ama versteckte Talente.`,tip:`-d çoğunlukla 'yapan'; Partizip II çoğunlukla 'yapılmış/etkilenmiş'.`,examples:[[`die fehlenden Unterlagen`,`eksik belgeler`],[`ein überzeugender Vortrag`,`ikna edici sunum`],[`die ausgewählten Kurse`,`seçilmiş kurslar`]],comparison:[[`lachende Kinder`,`çocuklar gülüyor`],[`geöffnete Türen`,`kapılar açılmış`],[`spannender Kurs`,`normal sıfat`]],questions:[d(`u14q1`,`Wir bieten einen ___ Workshop an.`,[`praxisorientierten`,`praxisorientierende`,`praxisorientiert`],`praxisorientierten`,`Akkusativ eril, belirsiz artikel sonrası -en gerekir.`),d(`u14q2`,`Die im Preis ___ Materialien bekommen Sie vor Ort.`,[`enthaltenden`,`enthaltenen`,`enthalten`],`enthaltenen`,`Malzemeler fiyata dâhil edilmiş durumdadır; Partizip II sıfatlaşır.`),f(`u14q3`,`Partizip sıfat yap: Teilnehmer, die warten`,`wartende Teilnehmer`,`Aktif ve devam eden eylem Partizip Präsens ile verilir.`),p(`u14q4`,`İsim grubunu kur.`,[`die`,`von Experten`,`entwickelten`,`Übungen`,`sind`,`anspruchsvoll`],`Die von Experten entwickelten Übungen sind anspruchsvoll.`,`Geliştirilmiş egzersizler Partizip Perfekt ile nitelenir.`)],reading:{type:`Kurs programı`,title:`Sicher in den Bergen`,text:`Der neu entwickelte Wochenendkurs richtet sich an wandernde Einsteigerinnen und Einsteiger. Erfahrene Bergführer erklären die wichtigsten Regeln. In kleinen Gruppen üben Sie den richtigen Umgang mit überraschend wechselndem Wetter. Die benötigte Ausrüstung kann vor Ort geliehen werden. Bereits absolvierte Erste-Hilfe-Kurse werden anerkannt.`,questions:[d(`u14r1`,`Kurs kime yönelik?`,[`Profesyonel dağcılara`,`Yürüyüşe yeni başlayanlara`,`Çocuklara`],`Yürüyüşe yeni başlayanlara`,`İlk cümlede Einsteigerinnen und Einsteiger deniyor.`),d(`u14r2`,`Hangi kolaylık sağlanıyor?`,[`Ücretsiz otel`,`Ekipman ödünç alma`,`Sınavsız sertifika`],`Ekipman ödünç alma`,`Dördüncü cümle ekipmanın kiralanabileceğini söyler.`)]},writing:{prompt:`Bir yetişkin eğitimi kursu için kısa tanıtım yaz.`,points:[`Hedef grubu söyle`,`İki içeriği Partizip sıfatla anlat`,`Pratik bilgiyi ekle`],phrases:[`Der neu entwickelte Kurs ...`,`Sie arbeiten mit ...`,`Vorkenntnisse sind nicht erforderlich.`],minWords:80,sample:`Der neu entwickelte Fotokurs richtet sich an interessierte Anfängerinnen und Anfänger. Sie arbeiten mit leicht verständlichen Anleitungen und von Profis ausgewählten Motiven. Gemeinsam besprechen wir die entstandenen Bilder. Eine eigene Kamera ist hilfreich, kann aber auch geliehen werden. Vorkenntnisse sind nicht erforderlich.`},speakingTask:{context:`Bir arkadaşına kurs öneriyorsun.`,phrases:[`Dieser Kurs passt zu dir, weil ...`,`Besonders hilfreich finde ich ...`,`Du brauchst keine ...`],prompt:`Yeni bir beceri öğrenmek isteyen birine kurs öner.`,sample:`Dieser Kochkurs passt zu dir, weil du gern praktisch lernst. Besonders hilfreich finde ich die von Ernährungsberatern entwickelten Rezepte. Du brauchst keine Vorkenntnisse und alle benötigten Zutaten sind im Preis enthalten.`}},{id:15,title:`Schön, dass Sie da sind.`,topicTr:`İş başvurusu ve mülakat`,vocabulary:[`başvuru`,`iş deneyimi`,`şirket`],grammar:[`nicht nur ... sondern auch`,`sowohl ... als auch`],communication:`Başvuru ve mülakat`,readingWriting:`İlan ve başvuru mektubu`,speaking:`Yetkinliklerini anlatma`,logic:`İki olumlu unsuru birlikte vurgulamak için sowohl ... als auch; ikinci unsuru ek bir vurgu olarak büyütmek için nicht nur ... sondern auch kullanılır.`,wordOrder:`Bağlanan ögeler dil bilgisel olarak paralel olmalıdır. sondern'dan önce virgül kullanılır.`,pitfall:`Bir tarafta isim, diğer tarafta tam cümle bağlamak paralelliği bozar.`,tip:`Aynı türden iki parçayı bağla: iki isim, iki sıfat veya iki fiil grubu.`,examples:[[`Ich kann sowohl planen als auch präsentieren.`,`Hem planlayabilir hem sunabilirim.`],[`Sie ist nicht nur erfahren, sondern auch flexibel.`,`Sadece deneyimli değil, aynı zamanda esnek.`],[`Die Stelle bietet sowohl Verantwortung als auch Entwicklung.`,`Pozisyon hem sorumluluk hem gelişim sunuyor.`]],comparison:[[`sowohl ... als auch`,`eşit vurgu`],[`nicht nur ... sondern auch`,`ikinci öge ek vurgu`],[`und`,`nötr ekleme`]],questions:[d(`u15q1`,`Ich spreche ___ Deutsch ___ Englisch.`,[`sowohl / als auch`,`nicht nur / oder`,`weder / aber`],`sowohl / als auch`,`İki olumlu dili eşit biçimde ekler.`),d(`u15q2`,`Die Stelle ist nicht nur abwechslungsreich, ___ auch gut bezahlt.`,[`als`,`sondern`,`oder`],`sondern`,`Sabit yapı nicht nur ..., sondern auch'tur.`),f(`u15q3`,`Birleştir: Ich organisiere gut. Ich leite gern Teams.`,`Ich kann nicht nur gut organisieren, sondern auch gern Teams leiten.`,`İki yetkinlik paralel fiil gruplarıyla bağlanır.`,[`Ich kann sowohl gut organisieren als auch gern Teams leiten.`]),p(`u15q4`,`Cümleyi kur.`,[`die Bewerberin`,`hat`,`sowohl`,`Erfahrung`,`als auch`,`gute Sprachkenntnisse`],`Die Bewerberin hat sowohl Erfahrung als auch gute Sprachkenntnisse.`,`İki isim grubu paralel bağlanır.`)],reading:{type:`İş ilanı`,title:`Servicekoordination gesucht`,text:`Wir suchen eine Person, die nicht nur Kundinnen und Kunden freundlich betreut, sondern auch Termine zuverlässig koordiniert. Sie bringen sowohl gute Deutschkenntnisse als auch Erfahrung mit digitalen Systemen mit. Wir bieten ein strukturiertes Einarbeitungsprogramm und flexible Arbeitszeiten. Bewerbungen mit kurzem Anschreiben bitte bis 15. September.`,questions:[d(`u15r1`,`İşin iki temel görevi nedir?`,[`Satış ve temizlik`,`Müşteri desteği ve randevu koordinasyonu`,`Çeviri ve muhasebe`],`Müşteri desteği ve randevu koordinasyonu`,`İlk cümle iki görevi bağlar.`),d(`u15r2`,`Başvuruda ne isteniyor?`,[`Uzun portfolyo`,`Kısa ön yazı`,`Video`],`Kısa ön yazı`,`Son cümlede kurzes Anschreiben belirtiliyor.`)]},writing:{prompt:`İlana uygun kısa başvuru e-postası yaz.`,points:[`İlana nerede rastladığını söyle`,`İki yetkinliği bağla`,`Görüşme isteğini belirt`],phrases:[`Hiermit bewerbe ich mich ...`,`Ich bringe sowohl ... als auch ... mit.`,`Über eine Einladung ... würde ich mich freuen.`],minWords:95,sample:`Sehr geehrte Damen und Herren, auf Ihrer Website habe ich die Stelle in der Servicekoordination gefunden. Hiermit bewerbe ich mich um diese Position. In meiner jetzigen Arbeit betreue ich nicht nur Kundinnen und Kunden, sondern plane auch Termine. Ich bringe sowohl gute Deutschkenntnisse als auch Erfahrung mit digitalen Buchungssystemen mit. Über eine Einladung zu einem persönlichen Gespräch würde ich mich sehr freuen. Mit freundlichen Grüßen`},speakingTask:{context:`Mülakatta deneyimini anlatıyorsun.`,phrases:[`Zu meinen Aufgaben gehört ...`,`Ich kann sowohl ... als auch ...`,`Ein Beispiel dafür ist ...`],prompt:`Seni bu işe uygun yapan özellikler neler?`,sample:`Ich kann sowohl strukturiert arbeiten als auch freundlich kommunizieren. Zu meinen Aufgaben gehört derzeit die Planung von Kundenterminen. Ein Beispiel für meine Zuverlässigkeit ist, dass ich ein neues Erinnerungssystem eingeführt habe.`}},{id:16,title:`Wir brauchten uns um nichts zu kümmern.`,topicTr:`Gençlik, aile ve geçmiş alışkanlıklar`,vocabulary:[`gençlik`,`anılar`,`ilişkiler`],grammar:[`nicht/nur brauchen + zu`],communication:`Önem ifade etme ve anıya tepki verme`,readingWriting:`Gençlik anısı`,speaking:`Kuşakları karşılaştırma`,logic:`brauchen + zu özellikle olumsuzluk veya nur ile zorunluluk yokluğu/sınırlı gereklilik bildirir: nicht zu = yapmak gerekmiyor; nur zu = yalnızca yapmak yeterli.`,wordOrder:`brauchen çekimli, zu'lu mastar sonda kalır. Ayrılabilen fiilde zu araya girer.`,pitfall:`Olumlu zorunlulukta brauchen yerine müssen daha doğaldır.`,tip:`nicht brauchen = gerek yok; müssen = gerekli; nicht müssen de gerek yok anlamına gelir.`,examples:[[`Wir brauchten nicht zu kochen.`,`Yemek yapmamız gerekmiyordu.`],[`Du brauchst nur anzurufen.`,`Sadece araman yeterli.`],[`Sie braucht sich um nichts zu kümmern.`,`Hiçbir şeyle ilgilenmesi gerekmiyor.`]],comparison:[[`Du musst gehen.`,`zorunlu`],[`Du musst nicht gehen.`,`gitmen gerekmiyor`],[`Du brauchst nicht zu gehen.`,`gitmene gerek yok`]],questions:[d(`u16q1`,`Als Kind brauchte ich im Haushalt nicht ___.`,[`helfen`,`zu helfen`,`geholfen`],`zu helfen`,`Olumsuz brauchen yapısında zu'lu mastar gerekir.`),d(`u16q2`,`Du brauchst mich nur ___.`,[`anzurufen`,`zu anrufen`,`anrufen zu`],`anzurufen`,`Ayrılabilen anrufen fiilinde zu araya girer.`),f(`u16q3`,`Düzelt: Wir brauchten keine Uniform tragen.`,`Wir brauchten keine Uniform zu tragen.`,`brauchen + olumsuzluk mastarla zu ister.`),p(`u16q4`,`Cümleyi kur.`,[`früher`,`brauchte`,`sie`,`sich`,`um Termine`,`nicht`,`zu kümmern`],`Früher brauchte sie sich nicht um Termine zu kümmern.`,`Çekimli brauchte ikinci, zu kümmern sonda.`)],reading:{type:`Forum anısı`,title:`Nachmittage ohne Plan`,text:`Als Jugendliche brauchten wir unsere Freizeit nicht lange zu planen. Nach der Schule trafen wir uns einfach auf dem Platz. Wir brauchten nur einen Ball mitzubringen, und schon begann ein Spiel. Handys gab es zwar, aber niemand musste ständig erreichbar sein. Heute brauchen meine Kinder viel mehr Termine zu koordinieren.`,questions:[d(`u16r1`,`Geçmişte buluşmak neden kolaydı?`,[`Daha çok para vardı`,`Az plan gerekiyordu`,`Okul yoktu`],`Az plan gerekiyordu`,`İlk iki cümle plansız buluşmayı vurgular.`),d(`u16r2`,`Bugün ne farklı?`,[`Çocuklar daha çok randevu koordine ediyor`,`Telefon yok`,`Kimse spor yapmıyor`],`Çocuklar daha çok randevu koordine ediyor`,`Son cümle bugünkü farkı verir.`)]},writing:{prompt:`Çocukluğundaki bir günlük alışkanlığı bugünle karşılaştır.`,points:[`Geçmişte ne yapman gerekip gerekmediğini yaz`,`Bugünkü farkı belirt`,`Kendi görüşünü ekle`],phrases:[`Früher brauchte ich ...`,`Heute muss/brauche ich ...`,`Am wichtigsten war mir ...`],minWords:85,sample:`Früher brauchte ich meine Nachmittage nicht zu planen. Nach der Schule ging ich direkt zu meinen Freunden. Wir brauchten nur unsere Fahrräder mitzunehmen. Heute plane ich fast jede freie Stunde und muss viele Termine beachten. Praktisch ist die bessere Organisation, aber manchmal vermisse ich die spontane Freiheit.`},speakingTask:{context:`Kuşak farkı üzerine konuşuyorsun.`,phrases:[`Früher war es üblich, dass ...`,`Heute brauchen Jugendliche ...`,`Ich kann gut verstehen, dass ...`],prompt:`Gençlerin bugün daha kolay ve daha zor bulduğu şeyler neler?`,sample:`Heute brauchen Jugendliche Informationen nicht lange zu suchen, weil alles online ist. Gleichzeitig müssen sie ständig viele Nachrichten bewerten. Ich kann gut verstehen, dass sie dadurch manchmal gestresst sind.`}},{id:17,title:`Guck mal! Das ist schön!`,topicTr:`Biyografi, sanat ve kişisel hikâye`,vocabulary:[`geçmiş ve bugün`,`sanat`,`resim`],grammar:[`Ausdrücke mit es`],communication:`Bir yaşam öyküsünü aktarma`,readingWriting:`Biyografi`,speaking:`Hayat dönüm noktalarını anlatma`,logic:`es bazı yapılarda gerçek özne, bazılarında kalıp veya yer tutucudur. Hava, saat, genel değerlendirme ve 'es gibt' gibi yapılar sabit biçimde kullanılır.`,wordOrder:`es ana cümlede özne olabilir; başka öge başa gelirse çoğu kalıpta çekimli fiilden sonra kalır: Heute gibt es ...`,pitfall:`es gibt her zaman Akkusativ alır; 'es sind viele Gründe' ile karıştırma.`,tip:`Kalıbı tek parça öğren: es gibt, es lohnt sich, es fällt mir schwer, es ist möglich.`,examples:[[`Es lohnt sich, ihre Bilder zu sehen.`,`Resimlerini görmek değer.`],[`Es fiel ihm schwer, die Heimat zu verlassen.`,`Memleketinden ayrılmak ona zor geldi.`],[`Damals gab es wenige Möglichkeiten.`,`O zaman az imkân vardı.`]],comparison:[[`es gibt + Akk.`,`var`],[`es fällt jemandem schwer`,`birine zor geliyor`],[`es lohnt sich`,`değer`]],questions:[d(`u17q1`,`In der Ausstellung ___ viele frühe Werke.`,[`gibt es`,`es sind gibt`,`gibt`],`gibt es`,`Başta yer ögesi olduğunda fiil ikinci, es üçüncü konumdadır.`),d(`u17q2`,`Es fiel der Künstlerin schwer, ihre Heimat ___.`,[`verlassen`,`zu verlassen`,`verließ`],`zu verlassen`,`es fällt schwer yapısından sonra zu'lu mastar gelir.`),f(`u17q3`,`Düzelt: Es lohnen sich, das Museum zu besuchen.`,`Es lohnt sich, das Museum zu besuchen.`,`Kalıp tekil ve kişisizdir: es lohnt sich.`),p(`u17q4`,`Cümleyi kur.`,[`für ihn`,`war`,`es`,`nicht leicht`,`neu anzufangen`],`Für ihn war es nicht leicht, neu anzufangen.`,`Değerlendirme kalıbında es fiilden sonra gelebilir.`)],reading:{type:`Biyografi`,title:`Mara Levin: Farben der Erinnerung`,text:`Mara Levin wurde 1978 in Riga geboren. Schon als Kind zeichnete sie täglich, obwohl es in ihrer Familie keine Künstler gab. Mit zwanzig zog sie nach Berlin. Am Anfang fiel es ihr schwer, Kontakte zu finden. Später gründete sie ein offenes Atelier für Jugendliche. Heute gibt es Ausstellungen ihrer Werke in mehreren Ländern.`,questions:[d(`u17r1`,`Berlin'de ilk zorluk neydi?`,[`Resim malzemesi`,`İlişki kurmak`,`Dil kursu bulmak`],`İlişki kurmak`,`Am Anfang ... Kontakte zu finden cümlesi bunu söyler.`),d(`u17r2`,`Sonraki sosyal katkısı nedir?`,[`Gençler için atölye kurmak`,`Müze kapatmak`,`Ülkesine dönmek`],`Gençler için atölye kurmak`,`Dördüncü cümlede açık atölye kurduğu belirtilir.`)]},writing:{prompt:`Hayran olduğun bir kişinin kısa biyografisini yaz.`,points:[`Doğum/başlangıç bilgisi`,`Bir zorluk ve dönüm noktası`,`Bugünkü etkisi`],phrases:[`Es fiel ihr/ihm schwer, ...`,`Später gelang es ...`,`Heute gibt es ...`],minWords:90,sample:`Der Fotograf Cem Aras wurde 1965 in Ankara geboren. Als junger Mann zog er nach Köln. Am Anfang fiel es ihm schwer, Arbeit und Kunst zu verbinden. Später gelang es ihm, mit einer Reportage bekannt zu werden. Er gründete außerdem kostenlose Fotokurse für Jugendliche. Heute gibt es Ausstellungen seiner Bilder in vielen Städten.`},speakingTask:{context:`Bir yaşam öyküsünü kısaca aktarıyorsun.`,phrases:[`Geboren wurde ...`,`Ein wichtiger Wendepunkt war ...`,`Besonders beeindruckt mich ...`],prompt:`Bir kişinin hayatındaki üç dönüm noktasını anlat.`,sample:`Geboren wurde sie in einer kleinen Stadt. Ein wichtiger Wendepunkt war ihr Umzug nach Wien. Dort gelang es ihr, eine Ausbildung zu beginnen. Besonders beeindruckt mich, dass sie später anderen jungen Menschen geholfen hat.`}},{id:18,title:`Davon halte ich nicht viel.`,topicTr:`Siyaset, toplum ve görüş bildirme`,vocabulary:[`siyaset`,`toplum`,`katılım`],grammar:[`weder ... noch`,`entweder ... oder`,`zwar ... aber`,`Wortbildung`],communication:`Tartışmada katılma ve karşı çıkma`,readingWriting:`Anket yorumu`,speaking:`Görüşü gerekçelendirme`,logic:`İkili bağlaçlar seçenek, çift olumsuzluk veya taviz bildirir. Yapım ekleri -heit/-keit, -ismus, -ler, -ant/-ent yeni isimler üretir.`,wordOrder:`Bağlanan ögeler paralel kalır. weder/entweder ilk konumdaysa özne-fiil sırasına dikkat edilir.`,pitfall:`weder ... noch zaten olumsuzdur; ek nicht gereksiz çift olumsuzluk yaratır.`,tip:`Seçim = entweder/oder; ikisi de değil = weder/noch; kabul + karşıtlık = zwar/aber.`,examples:[[`Entweder wir stimmen ab oder wir suchen einen Kompromiss.`,`Ya oylarız ya uzlaşma ararız.`],[`Weder die Zeit noch der Ort passt.`,`Ne zaman ne yer uyuyor.`],[`Die Idee ist zwar teuer, aber sinnvoll.`,`Fikir pahalı ama anlamlı.`]],comparison:[[`entweder ... oder`,`iki seçenek`],[`weder ... noch`,`iki olumsuz seçenek`],[`zwar ... aber`,`taviz + karşıtlık`]],questions:[d(`u18q1`,`Die Jugendlichen interessieren sich ___ nur für sich selbst, ___ sie engagieren sich anders.`,[`zwar / aber`,`weder / noch`,`entweder / oder`],`zwar / aber`,`İlk düşünce kısmen kabul edilip karşıt görüş getiriliyor.`),d(`u18q2`,`___ die Uhrzeit ___ der Ort ist schon festgelegt.`,[`Weder / noch`,`Zwar / aber`,`Sowohl / sondern`],`Weder / noch`,`İki unsurun da belirlenmediğini ifade eder.`),f(`u18q3`,`İsim yap: frei + -heit`,`Freiheit`,`frei sıfatı -heit ile die Freiheit olur.`),p(`u18q4`,`Seçenek cümlesini kur.`,[`entweder`,`wir`,`diskutieren`,`online`,`oder`,`wir treffen uns`],`Entweder diskutieren wir online oder wir treffen uns.`,`Entweder ilk konumdaysa fiil ikinci konuma gelir.`)],reading:{type:`Anket özeti`,title:`Wie engagieren sich junge Erwachsene?`,text:`Eine lokale Umfrage zeigt: Junge Erwachsene arbeiten zwar seltener dauerhaft in Parteien, aber sie beteiligen sich häufig an einzelnen Projekten. Weder Zeitmangel noch fehlendes Interesse erklären alle Unterschiede. Viele möchten entweder kurzfristig helfen oder digitale Aktionen unterstützen. Für Vereine bedeutet das, flexiblere Formen der Mitarbeit anzubieten.`,questions:[d(`u18r1`,`Temel sonuç nedir?`,[`Gençler hiç ilgilenmiyor`,`Katılım biçimi değişiyor`,`Partiler büyüyor`],`Katılım biçimi değişiyor`,`Metin kalıcı parti üyeliği yerine proje ve dijital katılımı gösteriyor.`),d(`u18r2`,`Derneklere ne öneriliyor?`,[`Daha esnek katılım`,`Üyeliği kapatmak`,`Sadece yüz yüze toplantı`],`Daha esnek katılım`,`Son cümle bunu doğrudan söyler.`)]},writing:{prompt:`Toplumsal katılım hakkında forum görüşü yaz.`,points:[`Bir iddiayı kısmen kabul et`,`Karşı görüş ve örnek ver`,`Bir çözüm öner`],phrases:[`Es stimmt zwar, dass ..., aber ...`,`Weder ... noch ...`,`Meiner Ansicht nach ...`],minWords:95,sample:`Es stimmt zwar, dass viele junge Menschen keiner Partei angehören, aber daraus folgt nicht, dass sie unpolitisch sind. Weder lange Sitzungen noch feste Ämter passen immer zu ihrem Alltag. Viele helfen lieber bei konkreten Projekten oder organisieren digitale Aktionen. Meiner Ansicht nach sollten Vereine deshalb sowohl kurze Einsätze als auch langfristige Aufgaben anbieten.`},speakingTask:{context:`Bir tartışmada görüş bildiriyorsun.`,phrases:[`Davon halte ich ...`,`Dafür/Dagegen spricht ...`,`Ganz meiner Meinung / Da bin ich anderer Meinung.`],prompt:`Gençler için zorunlu gönüllülük olmalı mı?`,sample:`Von einer Pflicht halte ich nicht viel. Dafür spricht zwar, dass alle etwas beitragen, aber freiwilliges Engagement ist oft motivierter. Besser wären attraktive Projekte, zwischen denen Jugendliche wählen können.`}}],_=[{id:19,title:`Je älter ich wurde, desto ...`,topicTr:`Turizm ve değişen tercihler`,vocabulary:[`manzara`,`turizm`,`tatil`],grammar:[`je ... desto/umso`,`Modalpartikeln`],communication:`Sunum ve kibar soru`,readingWriting:`Turizm sunumu`,speaking:`Tercih değişimini açıklama`,logic:`je ... desto iki değişkenin birlikte nasıl arttığını/azaldığını gösterir. denn, doch, eigentlich, ja gibi modal parçacıklar tutumu yumuşatır veya ortak bilgiyi hatırlatır.`,wordOrder:`je yan cümlesinde fiil sonda; desto/umso ana cümlesinde karşılaştırma ögesi ilk, fiil ikinci konumdadır.`,pitfall:`desto kısmında özneyi fiilden önce koyma: desto die Reise wird teurer yanlış.`,tip:`Je + Komparativ ..., desto + Komparativ + fiil + özne.`,examples:[[`Je länger wir bleiben, desto günstiger wird die Nacht.`,`Ne kadar uzun kalırsak gece o kadar ucuz.`],[`Gibt es denn auch Fahrradwege?`,`Peki bisiklet yolları da var mı?`],[`Das ist ja überraschend.`,`Bu gerçekten şaşırtıcı.`]],comparison:[[`je ... desto`,`orantılı değişim`],[`denn/eigentlich`,`soruyu yumuşatır`],[`ja`,`ortak/şaşırtıcı bilgi`]],questions:[d(`u19q1`,`Je früher wir buchen, ___ günstiger ist der Flug.`,[`denn`,`desto`,`obwohl`],`desto`,`Orantılı değişimin ikinci parçası desto/umso olur.`),d(`u19q2`,`Gibt es ___ auch eine Führung auf Deutsch?`,[`denn`,`desto`,`wegen`],`denn`,`denn soruyu daha doğal ve ilgili kılar.`),f(`u19q3`,`Tamamla: Je mehr Gäste kommen, ___ voller wird der Ort.`,`Je mehr Gäste kommen, desto voller wird der Ort.`,`Ana cümlede voller ilk, wird ikinci konumdadır.`),p(`u19q4`,`Cümleyi kur.`,[`je`,`ruhiger`,`die Umgebung`,`ist`,`desto`,`besser`,`erhole`,`ich mich`],`Je ruhiger die Umgebung ist, desto besser erhole ich mich.`,`je yan cümlesi fiille biter; desto cümlesinde erhole ikinci konumdadır.`)],reading:{type:`Presse notu`,title:`Reisen außerhalb der Saison`,text:`Je beliebter eine Region wird, desto stärker steigen oft die Preise. Unsere neue Kampagne empfiehlt Reisen im Frühling und Herbst. Dann sind nicht nur die Unterkünfte günstiger; auch Wege und Museen sind ruhiger. Je gleichmäßiger die Gäste über das Jahr verteilt sind, desto besser können lokale Betriebe planen.`,questions:[d(`u19r1`,`Kampanyanın amacı nedir?`,[`Yaz seyahatini artırmak`,`Sezon dışı seyahati teşvik etmek`,`Müzeleri kapatmak`],`Sezon dışı seyahati teşvik etmek`,`İkinci cümle ilkbahar ve sonbaharı önerir.`),d(`u19r2`,`Yerel işletmeler nasıl faydalanır?`,[`Daha iyi planlar`,`Daha az çalışan bulur`,`Sadece kışın açar`],`Daha iyi planlar`,`Son cümle yıl boyunca dengeli dağılımın planlamayı kolaylaştırdığını söyler.`)]},writing:{prompt:`Bir bölgeyi sürdürülebilir biçimde tanıtan kısa metin yaz.`,points:[`En iyi zamanı söyle`,`je-desto ile iki ilişki kur`,`Bir pratik öneri ekle`],phrases:[`Je ..., desto ...`,`Besonders empfehlenswert ist ...`,`Fragen Sie doch ...`],minWords:85,sample:`Besonders empfehlenswert ist die Küste im September. Je später im Jahr man reist, desto ruhiger werden die Strände. Je länger Gäste in kleinen Orten bleiben, desto mehr profitieren lokale Geschäfte. Nutzen Sie doch Bus und Fahrrad, denn viele Wege sind kurz. Fragen Sie eigentlich auch nach regionalen Führungen?`},speakingTask:{context:`Bir destinasyonu sunuyorsun.`,phrases:[`Zuerst möchte ich ... vorstellen.`,`Je ..., desto ...`,`Haben Sie denn noch Fragen?`],prompt:`Kalabalık turizmi azaltmak için iki öneri sun.`,sample:`Zuerst möchte ich Reisen außerhalb der Hauptsaison empfehlen. Je flexibler Gäste bei den Terminen sind, desto ruhiger erleben sie den Ort. Außerdem sollten sie länger bleiben und lokale Angebote nutzen. Haben Sie denn noch Fragen zur Anreise?`}},{id:20,title:`Die anderen werden es dir danken!`,topicTr:`Konaklama kuralları ve davranış`,vocabulary:[`kurallar`,`dağ konaklaması`,`misafirlik`],grammar:[`indem`,`sodass`],communication:`Kuralları tartışma ve değerlendirme`,readingWriting:`Ev kuralları ve misafir yorumu`,speaking:`Bir kuralı gerekçelendirme`,logic:`indem bir sonuca hangi yöntemle ulaşıldığını; sodass ise önceki eylemin sonucunu bildirir.`,wordOrder:`Her ikisi de yan cümledir ve fiil sonda kalır. indem yanıtı 'nasıl?', sodass yanıtı 'sonuç ne?'.`,pitfall:`Amaç için sodass değil damit/um zu kullanılır; sodass gerçekleşen sonucu vurgular.`,tip:`Mittel = indem; Resultat = sodass.`,examples:[[`Du sparst Energie, indem du das Licht ausschaltest.`,`Işığı kapatarak enerji tasarrufu yaparsın.`],[`Wir sprechen leise, sodass alle schlafen können.`,`Sessiz konuşuyoruz, böylece herkes uyuyabiliyor.`],[`Indem Gäste Regeln beachten, vermeiden sie Konflikte.`,`Misafirler kurallara uyarak çatışmayı önler.`]],comparison:[[`indem`,`araç/yöntem`],[`sodass`,`sonuç`],[`damit`,`amaç`]],questions:[d(`u20q1`,`Man vermeidet Müll, ___ man eine Flasche wiederverwendet.`,[`sodass`,`indem`,`obwohl`],`indem`,`Şişeyi tekrar kullanmak yöntemdir.`),d(`u20q2`,`Die Tür schließt leise, ___ niemand aufwacht.`,[`sodass`,`indem`,`wegen`],`sodass`,`Kimsenin uyanmaması sonuçtur.`),f(`u20q3`,`Düzelt: Indem alle schlafen können, sprechen wir leise.`,`Wir sprechen leise, sodass alle schlafen können.`,`Burada uyuyabilmek yöntem değil, sessiz konuşmanın sonucudur.`),p(`u20q4`,`Cümleyi kur.`,[`indem`,`du`,`vorher`,`reservierst`,`vermeidest`,`du`,`Wartezeiten`],`Indem du vorher reservierst, vermeidest du Wartezeiten.`,`indem yan cümlesinde reservierst sonda; ana cümlede vermeidest başta.`)],reading:{type:`Ev kuralları`,title:`Gemeinsam ruhig wohnen`,text:`Bitte schließen Sie die Eingangstür langsam, sodass sie nicht laut zufällt. Sie helfen uns, Energie zu sparen, indem Sie beim Lüften die Heizung abdrehen. Zwischen 22 und 7 Uhr bitten wir um Ruhe, sodass auch früh aufstehende Gäste schlafen können. Trennen Sie Ihren Müll an der Station im Hof.`,questions:[d(`u20r1`,`Isıtmada nasıl enerji tasarrufu yapılır?`,[`Pencereyi hiç açmayarak`,`Havalandırırken ısıtmayı kapatarak`,`Sadece gece ısıtarak`],`Havalandırırken ısıtmayı kapatarak`,`İkinci cümlede indem ile yöntem verilir.`),d(`u20r2`,`Sessizlik saatlerinin amacı nedir?`,[`Temizliği kolaylaştırmak`,`Erken kalkanların uyuması`,`Kapıyı korumak`],`Erken kalkanların uyuması`,`Üçüncü cümlede sodass sonucu açıklar.`)]},writing:{prompt:`Bir konaklama için kısa misafir yorumu yaz.`,points:[`İki olumlu ayrıntı`,`Bir kuralı ve sonucunu açıkla`,`Kime önerdiğini söyle`],phrases:[`Besonders gut hat mir ... gefallen.`,`Indem ..., ...`,`..., sodass ...`],minWords:80,sample:`Das Gästehaus war sauber und sehr ruhig. Besonders gut hat mir die gemeinsame Küche gefallen. Indem alle Lebensmittel beschrifteten, blieb alles übersichtlich. Abends wurde die Tür automatisch gedämpft, sodass niemand durch lautes Zufallen gestört wurde. Ich empfehle das Haus allen, die eine einfache und gut organisierte Unterkunft suchen.`},speakingTask:{context:`Ortak yaşam alanında bir kural öneriyorsun.`,phrases:[`Mir ist wichtig, dass ...`,`Das erreichen wir, indem ...`,`So ..., sodass ...`],prompt:`Ortak mutfak için iki kural ve gerekçe söyle.`,sample:`Mir ist wichtig, dass die Arbeitsflächen frei bleiben. Das erreichen wir, indem jeder sofort aufräumt. Außerdem sollten Lebensmittel beschriftet werden, sodass nichts versehentlich weggeworfen wird.`}},{id:21,title:`Vorher muss natürlich fleißig geübt werden.`,topicTr:`Konser, şehir etkinliği ve yön tarifleri`,vocabulary:[`konser`,`etkinlik`,`şehir`],grammar:[`lokal/temporal edatlar`,`Passiv Präsens mit Modalverben`],communication:`Bir etkinliği tanıtma`,readingWriting:`Blog ve reklam metni`,speaking:`Şehirde yol ve etkinlik anlatma`,logic:`Modal fiilli Passiv, yapılması gereken/izin verilen eylemi yapan kişiyi öne çıkarmadan anlatır. Yer-yön edatları rota ve sınır belirtir.`,wordOrder:`Modal fiil ikinci; Partizip II + werden sonda: Es muss geübt werden. innerhalb/außerhalb çoğunlukla Genitiv alır.`,pitfall:`Modal Passiv'de worden değil werden kullanılır.`,tip:`Modal + Partizip II + werden: üç parçayı sırayla kontrol et.`,examples:[[`Die Karten müssen vorher gekauft werden.`,`Biletler önceden alınmalı.`],[`Wir gehen am Fluss entlang.`,`Nehir boyunca gidiyoruz.`],[`Der Saal liegt außerhalb des Zentrums.`,`Salon merkezin dışında.`]],comparison:[[`muss üben`,`Aktiv`],[`muss geübt werden`,`Passiv`],[`ist geübt worden`,`Passiv Perfekt`]],questions:[d(`u21q1`,`Die Instrumente ___ sorgfältig transportiert werden.`,[`müssen`,`werden`,`sind`],`müssen`,`Modal Passiv: müssen + Partizip + werden.`),d(`u21q2`,`Der Weg führt am See ___.`,[`herum`,`entlang`,`außerhalb`],`entlang`,`am See entlang sabit rota yapısıdır.`),f(`u21q3`,`Passiv yap: Man darf hier nicht fotografieren.`,`Hier darf nicht fotografiert werden.`,`Yapan kişi kaldırılır; darf + fotografiert + werden.`),p(`u21q4`,`Cümleyi kur.`,[`innerhalb`,`weniger Tage`,`müssen`,`alle Plakate`,`aufgehängt`,`werden`],`Innerhalb weniger Tage müssen alle Plakate aufgehängt werden.`,`Temporal grup başta, modal fiil ikinci, Passiv kümesi sonda.`)],reading:{type:`Etkinlik blogu`,title:`Musik rund um den Ring`,text:`Am Samstag finden Konzerte an sechs Orten rund um die Altstadt statt. Die Bühnen können zu Fuß erreicht werden: Folgen Sie einfach dem Ring um das Zentrum herum. Innerhalb des Festivalbereichs dürfen keine Glasflaschen mitgebracht werden. Tickets müssen vor dem ersten Konzert online aktiviert werden.`,questions:[d(`u21r1`,`Mekânlara nasıl ulaşılır?`,[`Sadece otobüsle`,`Yürüyerek`,`Tekneyle`],`Yürüyerek`,`İkinci cümlede zu Fuß deniyor.`),d(`u21r2`,`Önceden yapılması gereken nedir?`,[`Bileti çevrim içi etkinleştirmek`,`Cam şişe almak`,`Merkezi aramak`],`Bileti çevrim içi etkinleştirmek`,`Son cümle modal Passiv ile gerekliliği bildirir.`)]},writing:{prompt:`Yerel bir etkinlik için kısa reklam metni yaz.`,points:[`Yer ve zamanı söyle`,`İki ulaşım ipucu`,`Bir kuralı Passiv ile yaz`],phrases:[`Innerhalb ...`,`Gehen Sie ... entlang.`,`... muss/darf ... werden.`],minWords:80,sample:`Am Sonntag wird der Stadtpark zur großen Lesebühne. Innerhalb von fünf Stunden finden zwölf kurze Lesungen statt. Gehen Sie vom Bahnhof am Fluss entlang und dann einmal um das Theater herum. Der Eintritt ist frei. Plätze können nicht reserviert werden; Decken dürfen aber mitgebracht werden. Kommen Sie früh und entdecken Sie neue Stimmen!`},speakingTask:{context:`Bir ziyaretçiye etkinliği tanıtıyorsun.`,phrases:[`Am meisten beeindruckt ...`,`Sie gehen ... entlang.`,`Vor dem Eintritt muss ...`],prompt:`Bir etkinliğin yolunu ve iki kuralını açıkla.`,sample:`Sie gehen vom Platz an der alten Mauer entlang. Der Eingang liegt außerhalb des Museumsgebäudes. Vor dem Eintritt muss das Ticket gezeigt werden. Große Taschen dürfen nicht mitgenommen werden.`}},{id:22,title:`In der BRD wurde die Demokratie eingeführt.`,topicTr:`Tarih ve toplumsal değişim`,vocabulary:[`tarih`,`devlet`,`Avrupa`],grammar:[`Passiv Präteritum`,`Passiv Perfekt`],communication:`Geçmişe ilişkin varsayım ve dilek`,readingWriting:`Tarihî olay özeti`,speaking:`Bir olayı önem sırasıyla anlatma`,logic:`Passiv Präteritum tarih anlatısında süreci/olayı, Passiv Perfekt tamamlanmış sonucu vurgular. Yapan kişi von + Dativ ile eklenebilir.`,wordOrder:`Präteritum: wurde/wurden + Partizip II. Perfekt: ist/sind + Partizip II + worden.`,pitfall:`Passiv Perfekt'te geworden değil worden kullanılır.`,tip:`Tarih kronolojisi = wurde; güncel sonuç/tamamlanma = ist ... worden.`,examples:[[`Die Grenze wurde 1989 geöffnet.`,`Sınır 1989'da açıldı.`],[`Das Denkmal ist später gebaut worden.`,`Anıt daha sonra inşa edildi.`],[`Der Vertrag wurde von mehreren Staaten unterzeichnet.`,`Antlaşma birkaç devlet tarafından imzalandı.`]],comparison:[[`wurde gebaut`,`Passiv Präteritum`],[`ist gebaut worden`,`Passiv Perfekt`],[`hat gebaut`,`Aktiv Perfekt`]],questions:[d(`u22q1`,`1990 ___ die beiden deutschen Staaten vereinigt.`,[`wurden`,`sind`,`haben`],`wurden`,`Çoğul özneyle tarih anlatısında wurden kullanılır.`),d(`u22q2`,`Das Museum ist 2018 eröffnet ___.`,[`geworden`,`worden`,`werden`],`worden`,`Passiv Perfekt'in son parçası worden'dır.`),f(`u22q3`,`Passiv yap: Man unterzeichnete den Vertrag 1957.`,`Der Vertrag wurde 1957 unterzeichnet.`,`Präteritum Passiv: wurde + Partizip II.`),p(`u22q4`,`Cümleyi kur.`,[`nach dem Krieg`,`sind`,`viele Gebäude`,`neu aufgebaut`,`worden`],`Nach dem Krieg sind viele Gebäude neu aufgebaut worden.`,`Çoğul özneyle sind; Partizip ve worden sonda.`)],reading:{type:`Müze metni`,title:`Vom Bahnhof zum Erinnerungsort`,text:`Das Gebäude wurde 1912 als Bahnhof eröffnet. Im Krieg wurde es stark beschädigt. Viele Jahre später ist die Halle restauriert worden. Dabei wurden originale Schilder erhalten. Seit 2020 wird der Ort als Museum genutzt, in dem Zeitzeugenberichte und private Fotos gezeigt werden.`,questions:[d(`u22r1`,`Restorasyonda ne korundu?`,[`Eski trenler`,`Orijinal tabelalar`,`Bilet fiyatları`],`Orijinal tabelalar`,`Dördüncü cümlede originale Schilder erhalten deniyor.`),d(`u22r2`,`Bina bugün ne olarak kullanılıyor?`,[`İstasyon`,`Müze`,`Otel`],`Müze`,`Son cümle 2020'den beri müze olduğunu söyler.`)]},writing:{prompt:`Bir tarihî yerin üç aşamalı özetini yaz.`,points:[`İlk yapılış/amaca değin`,`Bir değişimi Präteritum Passiv ile anlat`,`Bugünkü sonucu Perfekt Passiv ile belirt`],phrases:[`... wurde ...`,`Später wurden ...`,`Inzwischen ist ... worden.`],minWords:90,sample:`Die Markthalle wurde 1898 für regionale Händler gebaut. In den siebziger Jahren wurde sie geschlossen, weil ein neues Einkaufszentrum entstand. Später wurden Teile des Dachs repariert. Inzwischen ist das gesamte Gebäude restauriert worden. Heute finden dort Märkte, Konzerte und Ausstellungen statt. Viele alte Details sind bewusst erhalten worden.`},speakingTask:{context:`Bir tarihî olayı kısa sunuyorsun.`,phrases:[`Zunächst wurde ...`,`Ein entscheidender Moment war ...`,`Das hätte ich gern erlebt, weil ...`],prompt:`Bir tarihî değişimi ve önemini anlat.`,sample:`Zunächst wurde die alte Fabrik geschlossen. Ein entscheidender Moment war, als Bürgerinnen und Bürger für de
