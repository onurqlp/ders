name: G4 AYDA Digital Library Preview QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'g4-preview/index.html'
      - 'g4-preview/check-preview.cjs'
      - 'g4-preview/AYDA-UI-SYSTEM.md'
      - '.github/workflows/g4-library-preview-qa.yml'
permissions:
  contents: write
concurrency:
  group: ayda-g4-preview-only
  cancel-in-progress: true
jobs:
  preview-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate G4 mobile and desktop PREVIEW ONLY
        run: node g4-preview/check-preview.cjs
      - name: Save screenshot and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G4-Ayda-Library-Preview
          path: g4-preview/qa/
          retention-days: 20
      - name: Commit JSON QA report (not screenshots)
        if: always()
        run: |
          if [ -f g4-preview/qa/latest.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add g4-preview/qa/latest.json
            if ! git diff --cached --quiet; then
              git commit -m 'audit: G4 preview UI QA [skip ci]'
              git pull --rebase origin main
              git push
            fi
          fi
